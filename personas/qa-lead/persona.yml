# Persona manifest — QA Lead (Master Test Architect & Quality Advisor).
# Worked example for standards/persona-standards.md (in petry-projects/.github):
# the wrap-a-vendored-framework-agent, advisory-everywhere path.
#
# Naming: this persona is `qa-lead` — the ROLE (persona-standards.md §1.6).
# The vendored agent it wraps carries a person-name upstream; that stays
# upstream. We point at it only by its technical skill id (`framework.skill`).
#
# Validate against: petry-projects/.github standards/personas/persona.schema.json

schema_version: 1

id: qa-lead
name: QA Lead
title: Master Test Architect & Quality Advisor
summary: >-
  Advises on risk-based test strategy, fixture architecture, quality gates, and
  test review across the test and deliver phases — calculating risk vs value and
  treating flakiness as critical tech debt.

# Draft: the manifest and evals exist, but qa-lead is not yet cut as a fleet
# reusable and is not yet in canary-rings.json (see README). Promote once a
# dedicated advisory workflow + release are added.
status: draft

owner: petry-projects/org-leads

# --- How humans address this persona (§4.1) --------------------------------
# An org TEAM handle, never a user account: '@qa-lead' is a real, live GitHub
# account owned by a stranger, so keying on the bare role would silently
# notify them on every mention. The team slug equals `id`, so the router
# resolves a mention by stripping the org prefix.
#
# Team requirements (verified by CI, not by the schema — they need the network):
#   privacy: closed                               (secret teams are unmentionable)
#   notification_setting: notifications_disabled  (routes a webhook, not a page)
address:
  handle: petry-projects/qa-lead

definition:
  layers:
    # A vendored BMAD Test Architecture agent, consumed by path (vendor-neutral
    # markdown). We track upstream and contribute back rather than fork — so
    # there are no local hand-edits to frameworks/.
    - kind: framework-agent
      path: frameworks/bmad-test-architecture/src/agents/bmad-tea
      framework:
        name: bmad-test-architecture
        upstream_repo: bmad-code-org/bmad-method-test-architecture-enterprise
        vendor_pin: v1.19.0            # matches frameworks/bmad-test-architecture/VENDOR.md
        skill: bmad-tea
      # No local_overrides today. When qa-lead gains an org-specific advisory
      # wrapper (like prompts/bmad/scrum-master.md does for the Scrum Master
      # role), add it here and set upstream_candidate honestly.

# DECLARATIVE INVENTORY — not consumed at runtime (see issue #1649, AC #7).
# This list is the persona's index-of-record of the vendored skills it draws on;
# it is validated by personas/validate-personas.py (each path exists, and a
# `<name>/SKILL.md` path's directory equals `name`) but nothing reads it when the
# agent runs. The advisory prompt (prompts/qa-lead/advisory.md) reads the bmad-tea
# agent SKILL.md and lists the testarch workflows directory directly, so wiring
# skills[] into it would only duplicate that enumeration and enlarge the agent's
# context on every run. Keep this list accurate; it is the maintainer's inventory,
# not a runtime input.
#
# Coverage: eight of the nine vendored testarch workflows. `bmad-teach-me-testing`
# is deliberately excluded — it is a self-paced learner-tutorial workflow, not
# advisory test-architecture expertise, and is out of scope for this advisory
# persona (see README "What qa-lead is").
skills:
  - name: bmad-testarch-test-design
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-test-design/SKILL.md
    source: vendored
  - name: bmad-testarch-test-review
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-test-review/SKILL.md
    source: vendored
  - name: bmad-testarch-atdd
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-atdd/SKILL.md
    source: vendored
  - name: bmad-testarch-automate
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-automate/SKILL.md
    source: vendored
  - name: bmad-testarch-framework
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-framework/SKILL.md
    source: vendored
  - name: bmad-testarch-ci
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-ci/SKILL.md
    source: vendored
  - name: bmad-testarch-nfr
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-nfr/SKILL.md
    source: vendored
  - name: bmad-testarch-trace
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-trace/SKILL.md
    source: vendored

# qa-lead is a quality ADVISOR — advisory on every surface, write nowhere.
# (Test authoring, a future `write` opt-in, would add its own gate_label.)
#
# ENABLED must mean SERVED. A surface is `enabled: true` only when a deployed
# workflow actually serves it (persona-standards §1.1: the manifest is the
# index-of-record). The truth is recorded in personas/qa-lead/interaction.yml and
# enforced by validate-personas.py's surface-liveness invariant (#1647). Only two
# surfaces are wired today: `mention` (the shared persona-mention.yml router) and
# `pull_request` (both qa-lead-pr-advisory.yml, #1646, and the shared router, #2187,
# until the local workflow is retired). The rest are KEPT as
# `enabled: false` with the design intent intact — deleting them would lose it,
# leaving them `true` would be the lie the standard forbids.
triggers:
  default_mode: advisory
  opt_out_label: qa-lead:hands-off
  surfaces:
    - surface: pull_request
      events: [opened, ready_for_review]
      enabled: true
      mode: advisory
      notes: "Risk assessment + test-coverage review comments on PRs with test surface. Served on [opened, ready_for_review] by BOTH the local, self-contained qa-lead-pr-advisory.yml (#1646) AND the shared persona-mention router, which this repo's stub subscribes to pull_request (ADR-0009, #1869, #2187). Both call persona-runner-reusable.yml with surface=pull_request, so they share one per-(persona, repo, PR) concurrency group and the same already-advised marker check — a PR gets ONE advisory. The local workflow is retired (a separate issue) only after the router path is verified on real PRs, including the #1745 stop markers on a pull_request-sourced dispatch. `synchronize` is deliberately EXCLUDED (one advisory as a PR enters review, not on every push) — so the declared events match what is deployed. NOTE: The router-served pull_request pre-gate runs with github.token scoped to .github-private; it cannot read private source repositories other than .github-private, so those dispatches fail with a retryable workflow error before advisory generation — such private source repositories are out of scope."

    - surface: pull_request_review
      events: [submitted, created]
      enabled: false
      mode: advisory
      notes: "Intended future surface (weigh in on review threads about test quality / flakiness). NOT served: no workflow fires on pull_request_review. To serve: add a pull_request_review-triggered advisory workflow (the shape qa-lead-pr-advisory.yml already gives pull_request) and record the event in interaction.yml."

    - surface: issues
      events: [labeled, commented]
      enabled: false
      mode: advisory
      notes: "Intended future surface (test-design and NFR strategy input on issues/epics). NOT served: no workflow fires on the `issues` event — only @mention comments are routed, which is the separate `mention` surface. To serve: add an issues-triggered advisory workflow and record the `issues` event in interaction.yml."

    - surface: discussion
      events: [labeled, commented]
      enabled: false
      mode: advisory
      bridge: repository_dispatch
      notes: "Intended future surface (test-strategy input on discussions), encoding a real design decision: the repository_dispatch bridge of issue #571. NOT served: nothing sends that dispatch, and the discussion mention surface has no labels API (#1318), so qa-lead:hands-off cannot opt out a discussion. To serve: build the #571 bridge AND a labels-API workaround for the opt-out, then record the repository_dispatch event in interaction.yml."

    - surface: mention
      events: [created]
      enabled: true
      mode: advisory
      notes: "Direct invocation: '@petry-projects/qa-lead design tests for this epic'. SERVED by the shared persona-mention.yml router (issue_comment / pull_request_review_comment / discussion_comment)."

    - surface: check_run
      events: [completed]
      enabled: false
      mode: advisory
      notes: "Intended future surface (on CI failure, flag flakiness / weak coverage as test tech-debt, advisory only). NOT served: no workflow fires on check_run. To serve: add a check_run-triggered advisory workflow and record the event in interaction.yml."

    - surface: schedule
      events: []
      enabled: false
      mode: advisory
      notes: "Future: periodic test-health / flakiness sweep."

trust:
  author_association_floor: [OWNER, MEMBER, COLLABORATOR]

# qa-lead ships no dedicated reusable/stub in this pilot — it is consumed by
# path (e.g. by the initiative-planner) and is human-invocable via the persona
# runner. It declares only `runtime.identity`: on the advisory/comment path the
# persona runner authenticates with this account's PAT. It is the owner account
# `don-petry` (GH_PAT_DON_PETRY) — the identity ADR-0005 already sanctioned and
# ADR-0008 restores fleet-wide, reversing the #1650 switch to `donpetry-bot`.
# Trade-off ADR-0008 records honestly: a `don-petry` byline is a human account the
# router's actor axis cannot exclude (it must stay invocable by the maintainer who
# invokes it most), so the `<!-- persona: -->` marker axis becomes the sole
# mechanical recursion guard — acceptable because that marker is workflow-enforced
# in the post step (persona-runner-reusable.yml), not prompt-enforced. GH_PAT_DON_PETRY
# is known-good (dev-lead posts with it continuously); the bot PAT lacked
# comment-write here and silently discarded advisories (#1734). Add the rest of
# `runtime` + a canary-rings.json entry when a dedicated advisory workflow is wired.
runtime:
  identity:
    account: don-petry
    credential: GH_PAT_DON_PETRY

evals:
  required_before: stable
  path: evals/qa-lead/    # under the repo eval tree so validate-cases.py + holdout-guard.yml cover it
  judge: evals/judge.md
  min_cases: 5            # seed cases are placeholders; reach 5 held-out before stable

references:
  - "frameworks/bmad-test-architecture/VENDOR.md"
  - "prompts/bmad/scrum-master.md (qa-lead consulted during planning)"
  - "petry-projects/.github standards/persona-standards.md"
