# Interaction contract — qa-lead (persona lens).
#
# Shape fixed by docs/agentic-interaction-model.md §8.1; standalone repo-local
# file per the §8.2 location decision (option b). Story 2 / #1404.
#
# qa-lead is an advisory persona served on two surfaces:
#   1. Mention-routed: a human @petry-projects/qa-lead mention is parsed by the
#      shared router .github/workflows/persona-mention.yml and bridged
#      (repository_dispatch:persona-mention) to persona-runner.
#   2. Event-driven PR advisory (#1646 — [qa-lead S3]): served by the shared
#      persona-mention.yml router ALONE, which subscribes pull_request and
#      dispatches qa-lead per its declared [opened, ready_for_review] (ADR-0009,
#      #1869, #2187) with surface=pull_request. The runner's event pre-gate
#      (scripts/persona-pr-pregate.sh -> scripts/qa-lead-pr-gate.sh) applies
#      qa-lead's suppressors — test surface, opt-out, human hold, budget,
#      already-advised marker — so a PR gets ONE advisory. `synchronize` is
#      deliberately NOT wired. The local, self-contained workflow that served this
#      surface alongside the router was retired 2026-10-11 (#2243) once the
#      router path was verified on real PRs, including the #1745 stop markers on
#      a pull_request-sourced dispatch.
#      NOTE: Private source repositories other than .github-private are out of
#      scope for the router-served pull_request path: its pre-gate runs with
#      github.token scoped to .github-private and fails closed when it cannot
#      read them (the runner exits non-zero, a retryable workflow failure).
# Both surfaces post a single advisory comment as the persona's runtime.identity
# and write nothing else. The workflow's read/write split mechanically stamps the
# <!-- persona:qa-lead --> recursion marker; the prompt is not trusted to.
#
# triggers.events mirror the DEPLOYED on: block (AC #3/#8) of persona-mention.yml:
# issue_comment / pull_request_review_comment / discussion_comment / pull_request.
# As of #1647 persona.yml now AGREES with this contract: the surfaces nothing here serves
# (pull_request_review, issues, discussion, check_run) are `enabled: false` there,
# kept with notes as intended-future surfaces. The contract records what is
# actually deployed, not the aspiration (persona-standards finding 10 /
# petry-projects/.github#755); the validator's surface-liveness invariant (#1647)
# now makes the two files unable to silently diverge again.
schema_version: 1
role: qa-lead
kind: persona
workflows:
  - .github/workflows/persona-mention.yml
interaction:
  triggers:
    events:
      - issue_comment
      - pull_request_review_comment
      - discussion_comment
      - pull_request
    timers: []
  emits:
    - "comment:advisory-response"
  idempotency_key: "one advisory per PR (marker scan) for the event path; one run per mention (source_repo + item_number + comment_url) for the mention path"
  concurrency_lane: "persona-runner-qa-lead-<source_repo>-<pr>- (router-served event path); persona-runner-qa-lead-<source_repo>-<item_number>-<comment_url> (mention path)"
  stop_markers:
    - qa-lead:hands-off
    - needs-human-review
    - dev-lead:needs-human
  budget: pr-automation-budget
