# Persona Runtime — Reusable (dispatch side of the mention framework).
# This file is the source of truth. Caller: .github/workflows/persona-runner.yml.
# Standard: https://github.com/petry-projects/.github/blob/main/standards/persona-standards.md (§4.1)
#
# The router (petry-projects/.github persona-mention-reusable.yml) resolves an
# `@petry-projects/<role>` mention and fires a `persona-mention`
# repository_dispatch at this repo. This workflow receives it and runs the
# addressed persona's advisory prompt (prompts/<id>/advisory.md), posting exactly
# one advisory comment that carries the '<!-- persona:<id> -->' recursion marker.
#
# ONE runner for EVERY persona — manifest/convention driven, not one workflow per
# persona (§4.1).
#
# Read/write split (the recursion guarantee):
#   The AGENT gathers context and PRINTS the advisory between sentinels — it runs
#   with github.token, which reads the (public) source repo but CANNOT post to
#   it (that token is scoped to THIS repo). The WORKFLOW then enforces the marker
#   and posts, using the persona's declared posting PAT. So an agent that forgets
#   the marker cannot post an unmarked comment, because it cannot post at all.
#   Prompt-only marker enforcement is how .github-private#860 happened (1,481 acks
#   in 4.5h).
#
# Posting identity (per persona, from the manifest — NOT a repo-wide default):
#   Which account a persona's advisory posts as is read from that persona's
#   personas/<id>/persona.yml runtime.identity (account + credential), the
#   #1316/#1317 pattern. Advisory personas post as the OWNER account don-petry
#   (GH_PAT_DON_PETRY) — the identity ADR-0005 already sanctioned and
#   docs/architecture/adr/0008-personas-post-as-the-owner-account.md restores
#   fleet-wide, reversing #1650. GH_PAT_DON_PETRY is known-good (dev-lead posts
#   with it continuously); donpetry-bot's PAT lacked comment-write here and
#   silently discarded advisories (#1734). Trade-off ADR-0008 records honestly: a
#   don-petry byline is a human account the router's ACTOR axis cannot exclude
#   (it must stay invocable by the maintainer who invokes it most), so the
#   `<!-- persona: -->` MARKER axis becomes the SOLE mechanical recursion guard —
#   acceptable because that marker is workflow-enforced in the post step below
#   (pr_ensure_marker), not prompt-enforced (the #860 failure mode). The runner
#   holds only the PATs for the sanctioned posting identities and fails loudly on
#   any other declared credential.
#
# Requires:
#   CLAUDE_CODE_OAUTH_TOKEN — org secret, the engine credential
#   GH_PAT_DON_PETRY        — org PAT: the WORKFLOW uses it to post the comment as
#                             the owner don-petry on the cross-repo item. The
#                             agent never sees it. (ADR-0008)
#   DON_PETRY_BOT_GH_PAT    — org PAT for donpetry-bot, retained: other paths
#                             still post as the bot (pr-review's approver identity),
#                             and the resolution logic accepting both is what makes
#                             the ADR-0008 change a one-line manifest edit.
name: Persona Runtime — Reusable

on:
  workflow_call:
    inputs:
      persona:
        required: true
        type: string
      source_repo:
        required: true
        type: string
      item_number:
        required: false
        type: string
        default: ''
      comment_url:
        required: false
        type: string
        default: ''
      requested_by:
        required: false
        type: string
        default: ''
      mode:
        required: false
        type: string
        default: 'advisory'
      surface:
        # Which surface the dispatch came from. Defaults to 'mention' so existing
        # mention dispatches are unchanged. When 'pull_request', the persona's
        # event pre-gate runs before the engine (#1905). The local
        # qa-lead-pr-advisory.yml advise job now sets 'pull_request' too, so both
        # its run and the router-served run share this workflow's per-(persona,
        # repo,PR) concurrency group and the same already-advised marker check —
        # the serialization that prevents the two paths double-posting.
        required: false
        type: string
        default: 'mention'
      event_action:
        # The underlying event action the router observed (e.g. opened,
        # ready_for_review). Forwarded for parity with the router payload and
        # future per-persona gates; the surface's declared events are bound by
        # the router (ADR-0009), so the qa-lead decision does not consider it.
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      DON_PETRY_BOT_GH_PAT:
        # donpetry-bot's PAT — retained though advisory personas no longer post as
        # the bot (ADR-0008). Still referenced by other paths (pr-review's approver
        # identity), and keeping the resolution logic accepting both credentials is
        # what makes the ADR-0008 change a one-line manifest edit. Which PAT is used
        # is chosen per persona from runtime.identity.credential, not a repo-wide
        # default (.github-private#1650). Grandfathered credential name.
        required: false
      GH_PAT_DON_PETRY:
        # don-petry's PAT — the owner account advisory personas post as (ADR-0008,
        # restoring the ADR-0005 position; reverses #1650, fixes #1734). Chosen per
        # persona from runtime.identity.credential, never a repo-wide default.
        required: false
      # GH_PAT_WORKFLOWS removed (#1650): the broadly-scoped workflows PAT is no
      # longer a posting fallback here — least privilege, and posting under it
      # attributed advisories to a human owner account.

permissions: {}

concurrency:
  # One run per (persona, item). item_number is empty for discussions, so key on
  # comment_url too — otherwise every discussion mention for one persona+repo
  # would collapse into a single group and drop concurrent advisories.
  group: persona-runner-${{ inputs.persona }}-${{ inputs.source_repo }}-${{ inputs.item_number }}-${{ inputs.comment_url }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # checkout THIS repo's tooling + prompts. The agent reads the public source
      # repo with github.token; the comment is posted with the persona's manifest
      # PAT.
      contents: read
      # the event pre-gate (#1905) reads the PR's changed files, labels, and
      # reviews via github.token — with only contents:read those reads 403 on a
      # private source repo and every routed pull_request advisory fails closed
      # (skips).
      pull-requests: read
      # …and the shared issue-comment stream the gate scans for the
      # already-advised marker / automation budget.
      issues: read
    steps:
      - name: Checkout persona tooling + prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the persona's advisory prompt
        id: resolve
        env:
          PERSONA: ${{ inputs.persona }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/persona-runner.sh
          source scripts/lib/persona-runner.sh

          # This runner is a SEPARATE trust boundary from the router: a
          # repository_dispatch can be sent by anything holding a token, so the
          # payload is re-validated here. Distinguish the two failure modes:
          #   rc 2 = malformed id (a bad/hostile payload) — FAIL loudly, do not
          #          mask it as a benign skip.
          #   rc 3 = no advisory prompt for a well-formed id — benign ("persona
          #          has no runtime wired yet"), skip quietly.
          rc=0
          prompt_path="$(pr_require_advisory "$PERSONA" .)" || rc=$?
          case "$rc" in
            0)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "prompt_path=${prompt_path}" >> "$GITHUB_OUTPUT"
              echo "marker=$(pr_agent_marker "$PERSONA")" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "::notice::persona '${PERSONA}' has no advisory runtime — nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::rejecting persona-mention dispatch for malformed persona id '${PERSONA}'"
              exit 1
              ;;
          esac

      - name: Event pre-gate — suppress the pull_request surface before the engine
        # #1905. The router serves qa-lead's pull_request advisory here with
        # surface=pull_request, but binds only the GENERIC brakes — it does NOT
        # carry the persona-specific suppressors (no-test-surface, budget-
        # exhausted, already-advised) the local qa-lead gate enforces. Run the
        # persona's event pre-gate BEFORE the engine so a router-served PR
        # dispatch is suppressed with the SAME fidelity as the local surface;
        # otherwise the engine runs and posts on every trusted PR. For a mention
        # dispatch (surface defaults to 'mention') the gate is a no-op ('run'),
        # so existing mention behaviour is unchanged. Fails CLOSED: an unreadable
        # signal yields a skip (no engine, no post) with a ::error naming it.
        id: pregate
        if: steps.resolve.outputs.skip == 'false'
        env:
          # github.token reads the (public) source repo — the same read scope the
          # agent step uses. The pre-gate only READS PR signals; it never posts.
          GH_TOKEN: ${{ github.token }}
          PERSONA: ${{ inputs.persona }}
          SURFACE: ${{ inputs.surface }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          ITEM_NUMBER: ${{ inputs.item_number }}
          EVENT_ACTION: ${{ inputs.event_action }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/persona-pr-pregate.sh
          source scripts/persona-pr-pregate.sh

          decision="$(persona_event_pregate \
            "$PERSONA" "$SURFACE" "$SOURCE_REPO" "$ITEM_NUMBER" "$EVENT_ACTION" || true)"
          echo "persona pre-gate for '${PERSONA}' (surface=${SURFACE}) on ${SOURCE_REPO}#${ITEM_NUMBER}: ${decision}"
          if [ "$decision" = "run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            # Policy skips (no-test-surface, budget-exhausted, already-advised, ...)
            # stay green. An unreadable signal, malformed dispatch, or empty
            # decision must be a retryable failure, not a silently lost advisory.
            case "$decision" in
              skip:signal-unavailable | skip:unknown-surface | "")
                echo "::error::persona pre-gate could not decide (${decision:-empty}) — failing so the dispatch is retryable"
                exit 1
                ;;
            esac
          fi

      - name: Resolve the persona's posting identity from its manifest
        # Source of truth for who a persona posts as: personas/<id>/persona.yml
        # runtime.identity (the #1316/#1317 pattern). The runner honors the
        # manifest rather than a repo-wide default — a persona posting under a
        # human maintainer's PAT is exactly what #1650 removes. The runner holds
        # PATs only for the sanctioned posting identities; any other declared
        # credential fails loudly rather than silently borrowing a default.
        id: identity
        if: steps.resolve.outputs.skip == 'false' && steps.pregate.outputs.run == 'true'
        env:
          PERSONA: ${{ inputs.persona }}
        run: |
          set -euo pipefail
          account="$(bash scripts/lib/resolve-persona-identity.sh "$PERSONA" personas account)"
          credential="$(bash scripts/lib/resolve-persona-identity.sh "$PERSONA" personas credential)"
          case "$credential" in
            DON_PETRY_BOT_GH_PAT | GH_PAT_DON_PETRY) ;;
            *)
              echo "::error::persona '${PERSONA}' declares posting credential '${credential}', which this runner holds no PAT for. Add it to the reusable's secrets: block and the token map in the post step."
              exit 1
              ;;
          esac
          echo "account=${account}" >> "$GITHUB_OUTPUT"
          echo "credential=${credential}" >> "$GITHUB_OUTPUT"
          echo "resolved posting identity for '${PERSONA}': ${account} (${credential})"

      - name: Authorization preflight — fail before paying for the engine
        # #1776 (split from #1734 AC #5). The identity step above proved the
        # credential is one we hold a PAT for and RESOLVED which account it acts
        # as; it did NOT prove that account can WRITE. A credential can
        # authenticate correctly and still lack authorization to comment — the
        # exact break that reached `gh api .../comments`, returned 403, and
        # discarded a paid advisory (#1734), and that silently dropped a
        # pr-review approval on PR #1788. This step catches that class HERE,
        # before the engine call below, so paid model work is never produced and
        # then lost (AC #3, option a — the strongest position).
        #
        # The probe is NON-DESTRUCTIVE (AC #2): a single `GET /repos/{owner}/{repo}`
        # read of `.permissions` for the posting identity — no throwaway content is
        # ever written. It fails CLOSED only on a definite negative (readable
        # surface, no write bit) and fails OPEN (warn + proceed) on any
        # indeterminate result — a 5xx, rate limit, or unreadable surface must not
        # gate a legitimate advisory (AC #4). Missing/invalid secret is NOT handled
        # here — it takes the existing early-exit path (the wrapper skips when no
        # PAT is present; the post step fails closed on it). The credential is
        # derived per-persona from the manifest (via the identity step), so every
        # persona is covered without an enumerated list (AC #6).
        id: authz_preflight
        if: steps.resolve.outputs.skip == 'false' && steps.pregate.outputs.run == 'true'
        env:
          # Same manifest-driven PAT selection as the post step — the token that
          # WILL post is the token we probe. The agent step never sees these.
          BOT_PAT: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
          OWNER_PAT: ${{ secrets.GH_PAT_DON_PETRY }}
          POSTING_ACCOUNT: ${{ steps.identity.outputs.account }}
          POSTING_CREDENTIAL: ${{ steps.identity.outputs.credential }}
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          set -euo pipefail
          if [ "$POSTING_CREDENTIAL" = "DON_PETRY_BOT_GH_PAT" ]; then
            GH_TOKEN="${BOT_PAT}"
          else
            GH_TOKEN="${OWNER_PAT}"
          fi
          export GH_TOKEN

          # Verify the token authenticates as the manifest identity BEFORE probing
          # write access — otherwise a writable token for the WRONG account passes
          # the capability probe and triggers the paid engine, only to be rejected
          # by the post step's identity check afterward (the engine work is already
          # spent). A readable, definitely-wrong login fails closed here; an
          # UNREADABLE read (a failed call or an error body — never a login,
          # #2196) is indeterminate and left to the post step's retrying,
          # fail-closed check, matching this preflight's fail-open contract.
          # shellcheck source=scripts/lib/persona-runner.sh
          source scripts/lib/persona-runner.sh
          login_rc=0
          actual_login="$(pr_read_posting_login)" || login_rc=$?
          if [ "$login_rc" -eq 0 ] && [ "$actual_login" != "$POSTING_ACCOUNT" ]; then
            echo "::error::authz-preflight: posting token authenticates as '${actual_login}', not the manifest identity '${POSTING_ACCOUNT}' (credential '${POSTING_CREDENTIAL}') — refusing to run the engine under the wrong identity"
            exit 1
          elif [ "$login_rc" -eq 1 ]; then
            echo "::warning::authz-preflight: posting identity unreadable (${actual_login}) — indeterminate, proceeding; the post step verifies it"
          fi

          bash scripts/persona-authz-preflight.sh

      - name: Install Claude Code
        if: steps.resolve.outputs.skip == 'false' && steps.pregate.outputs.run == 'true'
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Produce the advisory (agent — read only, no post)
        if: steps.resolve.outputs.skip == 'false' && steps.pregate.outputs.run == 'true'
        id: advise
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude model list (scripts/lib/engine-models.sh): the persona runs the
          # deep tier's primary, the same model run-eval.sh scores it on.
          AI_MODELS_CLAUDE: ${{ vars.AI_MODELS_CLAUDE || '' }}
          # github.token: reads the PUBLIC source repo, cannot post to it (scoped
          # to THIS repo). The agent deliberately never receives a posting PAT.
          GH_TOKEN: ${{ github.token }}
          PERSONA: ${{ inputs.persona }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          ITEM_NUMBER: ${{ inputs.item_number }}
          COMMENT_URL: ${{ inputs.comment_url }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          AGENT_MARKER: ${{ steps.resolve.outputs.marker }}
          PROMPT_PATH: ${{ steps.resolve.outputs.prompt_path }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.npm-global/bin:$PATH"
          # The deep tier's chain (AI_MODELS_CLAUDE deep=…, else the default) —
          # run-eval.sh scores `engine: persona` on the same chain. The CLI takes
          # one fallback, so the chain's 2nd model is it; a one-model chain gets
          # no fallback, so the persona never runs a model the chain left out. A
          # bad AI_MODELS_* entry is named, not silently ignored.
          # shellcheck source=scripts/lib/engine-models.sh
          source scripts/lib/engine-models.sh
          while IFS= read -r _models_line; do
            [ -n "$_models_line" ] && echo "::warning::$_models_line"
          done <<< "$(ai_models_problems)"
          persona_chain="$(ai_models_chain claude deep)"
          persona_model="${persona_chain%%,*}"
          persona_fallback="$(printf '%s' "$persona_chain" | cut -s -d, -f2)"
          persona_model_args=(--model "$persona_model")
          [ -z "$persona_fallback" ] || persona_model_args+=(--fallback-model "$persona_fallback")

          {
            echo "You are running headless for persona '${PERSONA}'. The work item details and summoner are provided in the environment variables SOURCE_REPO, ITEM_NUMBER, COMMENT_URL, and REQUESTED_BY."
            echo "Follow your instructions exactly. PRINT the advisory between the"
            echo "sentinels; do not attempt to post it (you cannot)."
            echo
            cat "$PROMPT_PATH"
          } > /tmp/persona-prompt.txt

          _out=$(mktemp) || exit 1
          _rc=0
          # --effort high: the deep (Opus) model's default reasoning effort is `medium`.
          # The persona advisory runs on the deep (Opus) tier, which pins `--effort
          # high` in scripts/engine.sh (#1898). Pin it here too so the live runtime
          # matches the eval-parity posture run_persona scores (run-eval.sh routes
          # `engine: persona` through the deep tier); otherwise the eval would pass
          # at a higher reasoning budget than production actually ships.
          claude --print \
            --permission-mode bypassPermissions \
            --allowedTools Bash \
            "${persona_model_args[@]}" \
            --effort high \
            -p "$(cat /tmp/persona-prompt.txt)" > "$_out" 2>&1 || _rc=$?

          if [ "$_rc" -ne 0 ]; then
            if grep -qiE "hit your.*(session )?limit|rate.?limit|usage limit|quota exceeded|too many requests" "$_out"; then
              echo "::notice::engine rate-limited — leaving ${SOURCE_REPO}#${ITEM_NUMBER} un-answered (a future mention retries)"
              echo "skip_post=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$_out"
            echo "::error::persona agent failed (rc=$_rc)"
            exit "$_rc"
          fi

          # Stash raw agent output for the post step to parse (multi-line, so a
          # file, not a step output).
          cp "$_out" "$RUNNER_TEMP/agent-out.txt"
          echo "skip_post=false" >> "$GITHUB_OUTPUT"

      - name: Enforce marker and post the comment (workflow — the only writer)
        id: post
        if: steps.resolve.outputs.skip == 'false' && steps.pregate.outputs.run == 'true' && steps.advise.outputs.skip_post == 'false'
        env:
          # The PAT lives ONLY here. The agent step above never had it. WHICH
          # PAT is used is driven by the persona manifest
          # (runtime.identity.credential), resolved in the "identity" step —
          # never a repo-wide default. The resolve step already constrained
          # credential to this known set.
          BOT_PAT: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
          OWNER_PAT: ${{ secrets.GH_PAT_DON_PETRY }}
          PERSONA: ${{ inputs.persona }}
          POSTING_ACCOUNT: ${{ steps.identity.outputs.account }}
          POSTING_CREDENTIAL: ${{ steps.identity.outputs.credential }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          ITEM_NUMBER: ${{ inputs.item_number }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/persona-runner.sh
          source scripts/lib/persona-runner.sh

          # Compute the artifact name and the preserved-body path up front and
          # publish them as step outputs NOW, before anything below can fail:
          # $GITHUB_OUTPUT is read at step completion regardless of exit code, so
          # the failure-only upload step can find the right artifact even when
          # this step exits non-zero (#1775 AC #1).
          artifact_name="$(pr_artifact_name "$PERSONA" "$SOURCE_REPO" "$ITEM_NUMBER")"
          body_file="$RUNNER_TEMP/persona-advisory-body.md"
          {
            echo "artifact_name=${artifact_name}"
            echo "body_file=${body_file}"
          } >> "$GITHUB_OUTPUT"

          # Select the appropriate PAT based on the persona's manifest identity
          if [ "$POSTING_CREDENTIAL" = "DON_PETRY_BOT_GH_PAT" ]; then
            GH_TOKEN="${BOT_PAT}"
          else
            GH_TOKEN="${OWNER_PAT}"
          fi
          export GH_TOKEN

          # Extract the advisory, guarantee the recursion marker, and write the
          # redacted body to $body_file FIRST — so the upload step below has it
          # on ANY failure here (#2196) — then verify the token authenticates as
          # the manifest account (defense in depth against the #1650
          # wrong-identity regression: a readable mismatch or a missing PAT fails
          # closed at once; an unreadable read is retried, then fails closed),
          # then post. A failing post preserves the body and still fails the run
          # (#1775). The marker enforcement is load-bearing (ADR-0008) — see
          # pr_run_post in scripts/lib/persona-runner.sh.
          pr_run_post \
            "$PERSONA" "$SOURCE_REPO" "$ITEM_NUMBER" \
            "$POSTING_ACCOUNT" "$POSTING_CREDENTIAL" \
            "$RUNNER_TEMP/agent-out.txt" "$body_file" "$GITHUB_STEP_SUMMARY"

      - name: Preserve the advisory as a run artifact (post failed)
        # Failure-only, byte-for-byte re-postable copy of record. Named
        # deterministically from the item so the right one is findable when
        # several runs have failed. The step above writes $body_file before its
        # identity check and post (#2196), so any failure after extraction
        # uploads it; if it never got that far, if-no-files-found:ignore keeps
        # this a clean no-op (#1775 AC #1/#2).
        if: failure() && steps.post.outputs.artifact_name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.post.outputs.artifact_name }}
          path: ${{ steps.post.outputs.body_file }}
          if-no-files-found: ignore
          retention-days: 30
