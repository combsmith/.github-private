name: PR Review Agent

on:
  workflow_call:
    inputs:
      agent_ref:
        # The .github-private ref to check out for the agent's own scripts
        # (engine.sh, review-one-pr.sh, …). A trigger-stub caller passes its
        # pinned channel (e.g. pr-review/stable) so the SCRIPTS run at the
        # pinned version, not the caller's branch — closing the reusable
        # self-ref gap (#506). Empty (the default) preserves the historical
        # behaviour exactly: actions/checkout treats an empty ref as "default".
        description: "Ref of petry-projects/.github-private to check out for agent scripts"
        type: string
        required: false
        default: ""
      # Mirror the workflow_dispatch inputs as workflow_call inputs so a trigger
      # stub can forward them. The job's env block already reads `inputs.*`;
      # these resolve from whichever trigger fired (dispatch or call).
      pr_url:
        description: "Optional: review a single PR URL instead of enumerating"
        type: string
        required: false
        default: ""
      dry_run:
        description: "If true, never submit reviews or comments"
        type: string
        required: false
        default: ""
      force_review:
        description: "If true, bypass idempotency and re-review at the same head SHA"
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      GOOGLE_API_KEY:
        required: false
      GOOGLE_API_KEY_2:
        # Extra Gemini API key for per-key rotation on rate-limit (#1777).
        required: false
      GOOGLE_API_KEY_3:
        # Extra Gemini API key for per-key rotation on rate-limit (#1777).
        required: false
      GOOGLE_API_KEY_4:
        # Extra Gemini API key for per-key rotation on rate-limit (#1777).
        required: false
      GH_PAT_DON_PETRY:
        # don-petry's write/workflows PAT, also exposed as COPILOT_GITHUB_TOKEN for
        # the Copilot review engine (Copilot access is an account-subscription
        # entitlement on don-petry, not a token scope, so the same PAT authenticates
        # the engine). Supplied by `secrets: inherit` callers. See
        # docs/pr-review-agent/machine-user-setup.md.
        required: false
      # Back-compat for callers that pass the Copilot token by name rather than via
      # `secrets: inherit` (e.g. TalkTerm). Both hold the same don-petry PAT and are
      # resolved only after GH_PAT_DON_PETRY. Retained until every pr-review caller
      # migrates to `secrets: inherit`, after which they can be dropped (issue #1327).
      COPILOT_GITHUB_TOKEN:
        required: false
      GH_PAT_DON_PETRY_COPILOT:
        # don-petry's Copilot-subscription PAT (Copilot review engine). Canonical
        # name under the GH_PAT_<ACCOUNT> schema; supersedes GH_PAT (below, kept as
        # a transition fallback). The bot's own PATs keep their grandfathered names.
        required: false
      GH_PAT:
        # DEPRECATED alias of GH_PAT_DON_PETRY_COPILOT — kept during migration.
        required: false
      DON_PETRY_BOT_GH_PAT:
        required: false
      # Classic PAT for the bot. Required for `gh pr review --approve`
      # (addPullRequestReview), which fails for fine-grained PATs. Preferred
      # over DON_PETRY_BOT_GH_PAT when set; see docs/pr-review-agent/machine-user-setup.md.
      DON_PETRY_BOT_GH_PAT_CLASSIC:
        required: false

# ── Reusable-only (#497 self-host pinning) ───────────────────────────────
# Event-driven triggering now lives in the thin caller `pr-review-trigger.yml`,
# which invokes this workflow pinned to `pr-review.yml@pr-review/stable` and
# passes `agent_ref: pr-review/stable` so the agent's own scripts run at the
# pinned version too. Keeping this file reusable-only is what lets
# .github-private's OWN PR reviews run the known-good `stable` release — not
# whatever is on the branch under review — which is what breaks the
# self-hosting circular dependency. The job below still reads `github.event.*`
# (inherited from the caller's triggering event) and `inputs.*` (forwarded by
# the stub), so its behaviour is unchanged.

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  # Per-PR-AND-head-SHA concurrency slot so runs never queue behind unrelated
  # PRs, AND a new push (new head SHA) does not share a slot with an in-flight
  # review of a now-stale SHA (#1422). SHA sources per trigger:
  #   pull_request / pull_request_review → github.event.pull_request.head.sha
  #   check_suite                        → github.event.check_suite.head_sha
  #   repository_dispatch (mention)      → github.event.client_payload.sha (if sent)
  # Triggers whose payload carries no SHA (workflow_dispatch's pr_url, a mention
  # without a sha) fall back to the bare per-PR group — identical to the prior
  # behaviour — so those are still serialized per PR.
  # PR identity is normalized to {repo}/pull/{number} for SHA-bearing event
  # triggers (pull_request, pull_request_review, check_suite) so all of them
  # land in the same concurrency slot for the same PR regardless of whether
  # the payload carries an html_url or an API url. URL-keyed triggers
  # (workflow_dispatch pr_url, repository_dispatch client_payload.pr_url)
  # keep their raw URL as the identifier. Manual batch runs (workflow_dispatch
  # without pr_url) use a shared slot.
  group: >-
    ${{
      (inputs.pr_url
       || github.event.client_payload.pr_url
       || (github.event.pull_request.number && format('{0}/pull/{1}', github.repository, github.event.pull_request.number))
       || (github.event.check_suite.pull_requests[0].number && format('{0}/pull/{1}', github.repository, github.event.check_suite.pull_requests[0].number)))
      && format('pr-review-pr-{0}{1}',
           inputs.pr_url
           || github.event.client_payload.pr_url
           || (github.event.pull_request.number && format('{0}/pull/{1}', github.repository, github.event.pull_request.number))
           || (github.event.check_suite.pull_requests[0].number && format('{0}/pull/{1}', github.repository, github.event.check_suite.pull_requests[0].number)),
           (github.event.pull_request.head.sha
            || github.event.check_suite.head_sha
            || github.event.client_payload.sha)
           && format('-{0}',
                github.event.pull_request.head.sha
                || github.event.check_suite.head_sha
                || github.event.client_payload.sha)
           || '')
      || 'pr-review-batch'
    }}
  # cancel-in-progress is intentionally FALSE (#534): re-enabling it kills the
  # IN-FLIGHT review — strictly worse than dropping a pending duplicate.
  # What FALSE does and does not protect (corrected per #1422 — the previous
  # "no cancelled-check noise" claim was contradicted by measurement):
  #   • IN-FLIGHT run — PROTECTED. A newer same-group event never cancels the
  #     run that is already executing.
  #   • PENDING run — NOT protected. GitHub's concurrency model admits one
  #     running + one pending per group; a third same-group event evicts the
  #     older PENDING run, which concludes as `cancelled`. Under high event
  #     volume most runs are cancelled BEFORE they start (~49% over the
  #     2026-08-02 window), and a cancelled run rendered as a failing check on
  #     the PR (#1421). So FALSE does not eliminate cancelled-check noise; it
  #     only moves it from in-flight to pending.
  # Keying the group by head SHA (above) removes the dominant CROSS-SHA eviction
  # path, so a run for the final head SHA is never evicted by churn on a stale
  # SHA — the coverage guarantee argued in
  # docs/pr-review-agent/concurrency-and-coverage.md. Same-head-SHA reviews stay
  # idempotent (the agent's marker makes a redundant run a fast no-op), so the
  # residual same-SHA races are safe to QUEUE rather than cancel. The outcome mix
  # is now a tracked number via scripts/pr_review_health.sh (run-outcome by event).
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Early exit conditions (avoids spinning up the runner for guaranteed no-ops):
    #   check_suite  — only proceed when CI succeeded and there's an associated PR.
    #                  Failing suites are always skipped by review-one-pr.sh; empty
    #                  pull_requests (e.g. direct pushes to main) have nothing to review.
    #   pull_request_review — skip COMMENTED reviews; they don't change merge-readiness.
    #                         CHANGES_REQUESTED reviews are also skipped because the PR
    #                         is now blocked; review-one-pr.sh would skip it anyway.
    if: >-
      (github.event_name != 'check_suite' ||
       (github.event.check_suite.conclusion == 'success' &&
        github.event.check_suite.pull_requests[0] != null))
      &&
      (github.event_name != 'pull_request_review' ||
       github.event.review.state == 'approved' ||
       github.event.review.state == 'dismissed')
    env:
      # Auth for every gh / script call in this job. The PAT must belong to BOT_USER.
      # Prefer the CLASSIC PAT (required for `gh pr review --approve` —
      # fine-grained PATs fail addPullRequestReview), falling back to the
      # fine-grained DON_PETRY_BOT_GH_PAT when the classic secret is unset.
      GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT_CLASSIC || secrets.DON_PETRY_BOT_GH_PAT }}
      # Single bot identity. DON_PETRY_BOT_GH_PAT authenticates as BOT_USER; that
      # account owns/has-access-to the personal repos scanned by list-prs.sh,
      # signs the cascade's escalation comments, and is filtered out of the
      # candidate queue (it can't approve its own PRs). Human reviewers are
      # routed via CODEOWNERS at escalation time, not pinned via env.
      BOT_USER: ${{ vars.BOT_USER || 'donpetry-bot' }}
      TARGET_ORG: ${{ vars.TARGET_ORG || 'petry-projects' }}
      AGENT_REPO: ${{ github.repository }}
      # Engine configuration — switch providers with Actions variables, no code
      # change (scripts/lib/engine-chain.sh, docs/engine-configuration.md):
      #   AI_ENGINES     ordered list of enabled engines, e.g. "claude,gemini,copilot";
      #                  an engine not listed is never used; the first is primary.
      #   REVIEW_ENGINE  legacy primary override; leave unset to let AI_ENGINES decide.
      #   AI_DUCK_ENGINE ordered rubber-duck engines, e.g. "gemini,claude": the next
      #                  runs when one returns no verdict; "none" alone turns it off;
      #                  default auto.
      #   AI_DUCK_MODEL  model for the first AI_DUCK_ENGINE entry.
      #   AI_MODELS_CLAUDE / AI_MODELS_GEMINI / AI_MODELS_COPILOT  each provider's
      #                  model list, e.g. "deep=<opus id>,<fallback id>; triage=…"
      #                  (scripts/lib/engine-models.sh). Every provider takes the same
      #                  keys: triage, deep, audit, action, single, duck. Omitted keys
      #                  keep their defaults.
      #   GEMINI_FLASH_MODEL / GEMINI_PRO_MODEL  replace just the first Gemini model
      #                  (triage + action / deep + audit + single).
      # The primary is derived here (expressions cannot split a list) from the
      # first AI_ENGINES entry; the scripts enforce the full list.
      AI_ENGINES: ${{ vars.AI_ENGINES || '' }}
      REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || (startsWith(vars.AI_ENGINES, 'gemini') && 'gemini') || (startsWith(vars.AI_ENGINES, 'copilot') && 'copilot') || 'claude' }}
      AI_DUCK_ENGINE: ${{ vars.AI_DUCK_ENGINE || '' }}
      AI_DUCK_MODEL: ${{ vars.AI_DUCK_MODEL || '' }}
      GEMINI_FLASH_MODEL: ${{ vars.GEMINI_FLASH_MODEL || '' }}
      GEMINI_PRO_MODEL: ${{ vars.GEMINI_PRO_MODEL || '' }}
      AI_MODELS_CLAUDE: ${{ vars.AI_MODELS_CLAUDE || '' }}
      AI_MODELS_GEMINI: ${{ vars.AI_MODELS_GEMINI || '' }}
      AI_MODELS_COPILOT: ${{ vars.AI_MODELS_COPILOT || '' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Copilot engine authenticates with don-petry's PAT (the account holds the
      # Copilot subscription entitlement, not a token scope). Prefer the collapsed
      # GH_PAT_DON_PETRY (inherit callers); fall back to the by-name secrets for
      # callers not yet on `secrets: inherit` (TalkTerm). See issue #1327.
      COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.COPILOT_GITHUB_TOKEN || secrets.GH_PAT }}
      # Gemini engine auth — GOOGLE_API_KEY is the secret name; newer Gemini CLI
      # versions expect GEMINI_API_KEY so we expose the same value under both names.
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_API_KEY_2: ${{ secrets.GOOGLE_API_KEY_2 }}
      GOOGLE_API_KEY_3: ${{ secrets.GOOGLE_API_KEY_3 }}
      GOOGLE_API_KEY_4: ${{ secrets.GOOGLE_API_KEY_4 }}
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      # Event-triggered runs respect LIVE_MODE (same semantics as the former schedule).
      # repository_dispatch (mention) always runs live.
      # workflow_dispatch respects the dry_run input.
      DRY_RUN: ${{ github.event_name == 'repository_dispatch' && 'false' || inputs.dry_run || (vars.LIVE_MODE == 'true' && 'false' || 'true') }}
      # PR URL to review. Populated from inputs (workflow_dispatch), client_payload
      # (repository_dispatch), or the PR context for event-triggered runs.
      # check_suite events may have multiple PRs; those are handled separately via
      # CHECK_SUITE_PRS in the "Enumerate candidate PRs" step.
      PR_URL_OVERRIDE: >-
        ${{
          inputs.pr_url
          || github.event.client_payload.pr_url
          || github.event.pull_request.html_url
          || ''
        }}
      # JSON array of PRs associated with a check_suite event. Empty for all
      # other event types. Consumed by "Enumerate candidate PRs" to extract URLs.
      CHECK_SUITE_PRS: >-
        ${{
          github.event_name == 'check_suite'
          && toJSON(github.event.check_suite.pull_requests)
          || '[]'
        }}
      DELEGATION_ORGS: ${{ vars.DELEGATION_ORGS || vars.CLAUDE_ORGS || '' }}
      MAX_REVIEW_CYCLES: ${{ vars.MAX_REVIEW_CYCLES || '3' }}
      MAX_PRS: ${{ vars.MAX_PRS || '10' }}
      CANDIDATE_LIMIT: ${{ vars.CANDIDATE_LIMIT || '250' }}
      # Opt-in GitHub MCP review (issue #679 / pilot #681). REVIEW_MCP_CONFIG
      # auto-defaults in engine.sh to the committed .github/review-mcp.json when
      # present (do NOT set it here — an empty value would disable that default).
      # The configured MCP tools must be allow-listed or the CLI connects the
      # server yet blocks the tool calls ("not permitted"); set the repo variable
      # REVIEW_MCP_ALLOWED_TOOLS (e.g. `mcp__github__*`) to permit them.
      REVIEW_MCP_ALLOWED_TOOLS: ${{ vars.REVIEW_MCP_ALLOWED_TOOLS || '' }}
      # Diagnostics opt-in: set repo variable REVIEW_MCP_DEBUG=1 to log the MCP
      # server handshake (`--debug mcp`) and surface a ::notice:: for a healthy
      # connection. Off by default; never changes the review verdict.
      REVIEW_MCP_DEBUG: ${{ vars.REVIEW_MCP_DEBUG || '' }}
      # Downstream-impact pass (epic #748 / discussion #653): annotate a review
      # with the consumer repos that pin a shared surface the PR changes. Enabled
      # by default here; set the repo variable DOWNSTREAM_IMPACT_ENABLED=false to
      # kill-switch it without a code change. Operator guide:
      # docs/pr-review-agent/downstream-impact.md.
      DOWNSTREAM_IMPACT_ENABLED: ${{ vars.DOWNSTREAM_IMPACT_ENABLED || 'true' }}
      # Pin via vars.CLAUDE_CODE_VERSION for fully reproducible caching; default
      # 'latest' caches an install indefinitely under that key — flush via the
      # Actions cache UI or bump the variable to pick up new releases.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
      TOKEN_LOG_FILE: /tmp/token-usage-${{ github.run_id }}.jsonl
      TOKEN_WORKFLOW: pr-review
      # Two distinct force flags (issue #1590 — do NOT re-merge them):
      #   FORCE_REVIEW    — the human @mention break-glass. It bypasses EVERY review
      #                     gate (ci-failing/ci-pending/advisory/maintainer/…), so it
      #                     is set ONLY by an explicit `client_payload.force_review:
      #                     true` on the repository_dispatch — never by the event
      #                     name alone (#2034). The mention listener also dispatches
      #                     for machine-added `review_requested: donpetry-bot`
      #                     events, which used to reach this bypass, approve past the
      #                     maintainer-comment gate, and be dismissed by the next
      #                     run — an approve/dismiss loop until the PR budget ran out.
      #                     A dispatch without the flag runs with every gate armed
      #                     and the narrow FORCE_RE_REVIEW idempotency bypass below.
      #   FORCE_RE_REVIEW — the narrow idempotency bypass. The `force_review` input
      #                     (workflow_dispatch / workflow_call, e.g. the automated
      #                     orphan-rescue sweep in scripts/sweep-stuck-reviews.sh)
      #                     clears ONLY the same-SHA idempotency no-op and leaves the
      #                     quality gates armed — so an automated re-review can never
      #                     silently convert into a gate bypass, and a stale CI
      #                     snapshot (TOCTOU) is re-validated at execution time.
      FORCE_REVIEW: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.force_review == true || github.event.client_payload.force_review == 'true') && 'true' || 'false' }}
      FORCE_RE_REVIEW: ${{ inputs.force_review || (github.event_name == 'repository_dispatch' && 'true') || 'false' }}

    steps:
      - name: Engine token preflight (#1525)
        # Mirrors dev-lead-reusable.yml's #1525 step (#1587): CLAUDE_CODE_OAUTH_TOKEN
        # is declared required:false (a required:true fails the CALLER at secrets
        # evaluation before any step runs — the opaque fleet-wide dispatch failure
        # #1525 deliberately relaxed), so PRESENCE is enforced here instead. Without
        # this, a tokenless pr-review run fails OPEN: it can exit `success` having
        # reviewed nothing, and that green conclusion was cited as "engine healthy"
        # during the 2026-08-23..30 outage. First step so a missing token is caught
        # before any runner setup is burned.
        #
        # Gated on the EFFECTIVE primary engine being claude — REVIEW_ENGINE as
        # scripts/lib/engine-chain.sh's ai_engine_primary resolves it against
        # AI_ENGINES (mirrored inline: this step runs before checkout). A valid
        # AI_ENGINES list decides; REVIEW_ENGINE wins only when that list enables
        # it; an empty list means the default chain claude,gemini,copilot, and an
        # invalid one means the default chain AND the default primary (claude).
        # The copilot/gemini engines authenticate with their own credentials
        # and install claude only best-effort, so they legitimately run WITHOUT this
        # token — failing them here would be a regression, not the fail-loud we want.
        env:
          REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || (startsWith(vars.AI_ENGINES, 'gemini') && 'gemini') || (startsWith(vars.AI_ENGINES, 'copilot') && 'copilot') || 'claude' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          effective_primary() {
            local pref spec e chain="" valid=true first
            pref="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            spec="$(printf '%s' "${AI_ENGINES:-}" | tr '[:upper:],' '[:lower:] ')"
            set -f
            for e in $spec; do
              case "$e" in
                claude|gemini|copilot) case " $chain " in *" $e "*) ;; *) chain="$chain $e" ;; esac ;;
                *) valid=false ;;
              esac
            done
            set +f
            if [ "$valid" = false ]; then chain=""; pref=""; fi
            [ -n "${chain// /}" ] || chain=" claude gemini copilot"
            if [ -n "$pref" ] && [[ "$chain " == *" $pref "* ]]; then printf '%s' "$pref"; return; fi
            first="${chain# }"
            printf '%s' "${first%% *}"
          }
          if [ "$(effective_primary "$REVIEW_ENGINE")" = "claude" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            msg="CLAUDE_CODE_OAUTH_TOKEN is not provided to pr-review."
            msg="$msg To pause deliberately, set AGENTS_PAUSED=true Actions variable"
            msg="$msg instead of withholding the secret (see #1525)."
            msg="$msg Otherwise restore the secret (claude setup-token) in the calling repo/org."
            echo "::error::$msg"
            exit 1
          fi
          echo "engine token present (or non-claude engine) — proceeding"

      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always check out the AGENT repo (.github-private) for the scripts —
          # NOT the caller's repo. When invoked from a consumer (e.g. markets),
          # the default checkout would clone the consumer at `agent_ref`, which
          # has no such ref → failure. .github-private is public, so the default
          # token can read it. `agent_ref` (e.g. pr-review/stable) pins the
          # scripts to the known-good channel; empty defaults to main (#506/#536).
          repository: petry-projects/.github-private
          ref: ${{ inputs.agent_ref || 'main' }}

      - name: Resolve persona identity
        # pr-review's acting account is DECLARED in personas/pr-review/persona.yml
        # (runtime.identity.account = donpetry-bot, the review-only machine user).
        # Resolving BOT_USER from the manifest — instead of the shared vars.BOT_USER
        # — is what keeps this identity from colliding with dev-lead's (#1316). The
        # job-env BOT_USER remains the fail-safe default if the manifest is unreadable.
        run: |
          if account="$(bash scripts/lib/resolve-persona-identity.sh pr-review personas account)"; then
            echo "BOT_USER=$account" >> "$GITHUB_ENV"
            echo "resolved pr-review identity: BOT_USER=$account"
          else
            echo "::warning::could not resolve pr-review identity from manifest; using fallback BOT_USER=$BOT_USER"
          fi

      - name: Resolve claude-code version
        # A literal "latest" cache key never changes, so the first CLI ever cached
        # was reused indefinitely (2.1.138 outlived the Opus 5.5 launch — #1957).
        # Resolve it to the concrete npm version so a new release misses the cache,
        # and install exactly that version on a miss (never re-resolve "latest");
        # a pinned vars.CLAUDE_CODE_VERSION passes through unchanged.
        id: claude_code_version
        env:
          REQUESTED_VERSION: ${{ env.CLAUDE_CODE_VERSION || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          v="$REQUESTED_VERSION"
          install="$v"
          if [ "$v" = "latest" ]; then
            v="$(npm view @anthropic-ai/claude-code version 2>/dev/null || true)"
            if [ -n "$v" ]; then
              install="$v"
            else
              v="latest-$(date -u +%G-w%V)"
              echo "::warning::could not resolve the latest claude-code version; using weekly cache key $v"
            fi
          fi
          echo "claude-code cache version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "install=$install" >> "$GITHUB_OUTPUT"

      - name: Cache claude-code CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ steps.claude_code_version.outputs.version }}-${{ runner.os }}

      - name: Verify auth scopes
        # Inlined from scripts/verify-auth-scopes.sh so this step is self-contained
        # when pr-review.yml is deployed to target repos that do not have the scripts/ dir.
        run: |
          set -euo pipefail

          if auth_status="$(gh auth status 2>&1)"; then
            :
          else
            auth_rc=$?
            printf '%s\n' "$auth_status"
            echo "::error::gh auth status failed"
            exit "$auth_rc"
          fi
          printf '%s\n' "$auth_status"

          # Fine-grained PATs are NOT supported — they fail at addPullRequestReview.
          # Two detection methods: (1) prefix in auth status output; (2) gh auth token
          # for gh versions that mask the prefix in status output (token never logged).
          _fgpat=0
          if grep -qi 'Token:.*github_pat_' <<< "$auth_status"; then
            _fgpat=1
          else
            _tok="$(gh auth token 2>/dev/null || true)"
            if [[ "${_tok:-}" == github_pat_* ]]; then
              _fgpat=1
            fi
            unset _tok
          fi
          if [[ "$_fgpat" -eq 1 ]]; then
            unset _fgpat
            echo "::error::Fine-grained PAT detected — fine-grained PATs are not supported by this workflow."
            echo "::error::Fine-grained PATs fail at addPullRequestReview (GraphQL: Resource not accessible by personal access token)."
            echo "::error::Replace DON_PETRY_BOT_GH_PAT with a classic PAT that has repo, workflow, and read:org scopes."
            echo "::error::See docs/pr-review-agent/setup.md → Troubleshooting for details."
            exit 1
          fi
          unset _fgpat

          scopes_line="$(grep 'Token scopes:' <<< "$auth_status" || true)"
          normalized_scopes="${scopes_line//,/ }"
          normalized_scopes="${normalized_scopes//$'\''/ }"

          if [ -z "$normalized_scopes" ] || grep -qiE '(cannot determine|fine.grained)' <<< "$auth_status"; then
            echo "::warning::Token scopes could not be determined. Skipping scope validation."
            echo "::warning::Ensure the token has: repo + read:org (classic PAT) or contents + pull_requests:write."
            exit 0
          fi

          if grep -qE "(^|[[:space:]])repo([[:space:]]|$)" <<< "$normalized_scopes"; then
            if ! grep -qE "(^|[[:space:]])read:org([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN has 'repo' scope but is missing 'read:org'."
              echo "::error::PRs with team-based reviewers will fail at 'gh pr view --json reviewRequests'."
              echo "::error::Edit the classic PAT and check the 'read:org' box (no regeneration needed)."
              exit 1
            fi
          else
            if ! grep -qE "(^|[[:space:]])contents(:[^[:space:]]+)?([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN is missing required scope: contents"
              echo "::error::Token must have either 'repo' + 'read:org' (classic) or 'contents' + 'pull_requests:write'"
              exit 1
            fi
            if ! grep -qE "(^|[[:space:]])pull_requests(:write)?([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN is missing required scope: pull_requests with write access"
              echo "::error::Token must have either 'repo' + 'read:org' (classic) or 'contents' + 'pull_requests:write'"
              exit 1
            fi
          fi

      - name: Install review engine CLIs
        env:
          CLAUDE_CODE_VERSION: ${{ steps.claude_code_version.outputs.install || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          set -euo pipefail

          # Use a per-user prefix so actions/cache (above) can persist the
          # install across runs without needing root. Add the bin dir to PATH
          # for both this step and every subsequent step in the job.
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          npm_install_retry() {
            # npm_install_retry <package> [attempts=3] [delay_seconds=15]
            local package="$1"
            local attempts="${2:-3}"
            local delay="${3:-15}"
            local attempt=1
            while [ "$attempt" -le "$attempts" ]; do
              if npm install -g "$package"; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "::warning::npm install failed for $package (attempt $attempt/$attempts); retrying in ${delay}s"
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          install_claude() {
            if command -v claude >/dev/null 2>&1; then
              echo "claude-code cache hit: $(claude --version)"
              return 0
            fi
            npm_install_retry "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" || return 1
            # Log the version actually in use on a fresh install too (#1957).
            echo "claude-code installed: $(claude --version 2>/dev/null || echo unavailable)"
          }

          case "$REVIEW_ENGINE" in
            claude)
              install_claude
              # Best-effort install of fallbacks for duck/fallback support
              npm_install_retry "@google/gemini-cli" || true
              if ! command -v gemini >/dev/null 2>&1; then
                echo "::warning::gemini CLI unavailable — Gemini rate-limit fallback will be unavailable"
              fi
              if ! env GH_TOKEN="$COPILOT_GITHUB_TOKEN" gh copilot --version > /dev/null 2>&1; then
                echo "::warning::gh copilot built-in unavailable with user token — rate-limit fallback will be unavailable."
              fi
              ;;
            gemini)
              npm_install_retry "@google/gemini-cli"
              install_claude || true
              ;;
            copilot)
              # Best-effort install of copilot if built-in is missing
              if ! gh copilot --version > /dev/null 2>&1; then
                gh extension install github/gh-copilot || true
              fi
              install_claude || true
              npm_install_retry "@google/gemini-cli" || true
              if ! command -v gemini >/dev/null 2>&1; then
                echo "::warning::gemini CLI unavailable — Gemini duck review will be skipped"
              fi
              ;;
            *)
              echo "::error::Unknown REVIEW_ENGINE=$REVIEW_ENGINE"
              exit 1
              ;;
          esac

      - name: Enumerate candidate PRs
        run: |
          set -euo pipefail

          if [ -n "${PR_URL_OVERRIDE}" ]; then
            # Single-PR mode: workflow_dispatch with pr_url, repository_dispatch
            # (mention), or event-triggered run with a direct PR context
            # (pull_request_review / pull_request events).
            printf '%s\n' "${PR_URL_OVERRIDE}" > prs.txt
          elif [ "${CHECK_SUITE_PRS}" != "[]" ] && [ -n "${CHECK_SUITE_PRS}" ]; then
            # check_suite event: one or more PRs share the completed suite.
            # The payload carries API URLs (https://api.github.com/repos/…/pulls/N);
            # convert them to HTML URLs (https://github.com/…/pull/N) for review-one-pr.sh.
            echo "${CHECK_SUITE_PRS}" \
              | jq -r '.[].url' \
              | sed 's|https://api\.github\.com/repos/|https://github.com/|; s|/pulls/|/pull/|' \
              > prs.txt
          else
            bash scripts/list-prs.sh > prs.txt
          fi

          count=$(grep -c . prs.txt || true)
          echo "::notice::Candidate pool has $count PRs (no-ops will be skipped, MAX_PRS caps actual reviews)"
          echo "--- candidate PRs ---"
          if [ -s prs.txt ]; then
            cat prs.txt
          else
            echo "(empty file)"
          fi

      - name: Review each PR (cascade)
        run: bash scripts/review-batch.sh

      - name: Upload debug log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Collect both current cascade logs and legacy/supplemental log paths.
        with:
          name: pr-review-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            prs.txt
            /tmp/cascade/**
            /tmp/review-*.log
            ${{ runner.temp }}/cascade/**
            ${{ runner.temp }}/review-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload token usage log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-usage-${{ github.run_id }}
          path: /tmp/token-usage-${{ github.run_id }}.jsonl
          if-no-files-found: ignore
          retention-days: 30
