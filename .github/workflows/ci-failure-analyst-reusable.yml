# This file is the source of truth. Callers: .github/workflows/ci-failure-analyst.lock.yml (this repo)
# and any repo deploying templates/ci-failure-analyst.yml.
name: "CI Failure Analyst — Reusable"
# readme-agent: CI failure analyst — diagnoses failed CI/Lint/Test runs and comments root-cause analysis.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# Mirrors the validated permission set declared by the caller
# (ci-failure-analyst.lock.yml): post a PR comment (pull-requests/issues: write),
# read failed-run logs via gh run view (actions: read) and the PR diff (contents: read).
permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  analyze:
    # AGENTS_PAUSED (#1525, #2249): with the fleet paused this job is skipped
    # (neutral, not red).
    # No `fleet-paused` notice job here: the canary promotion gate counts every
    # run of this reusable that ends success or failure as a health sample, and a
    # run whose only work was the notice would end success. With every job
    # skipped the run ends skipped, which the gate does not count.
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      # The payload resolution lives in scripts/ci-failure-analyst-resolve.sh
      # (tests: tests/ci_failure_analyst_resolve.bats). Fetch it from THIS
      # reusable's own commit, so a caller pinned to a channel always runs the
      # script that matches the workflow it pinned. .github-private is public,
      # so the caller's token can read it.
      # Downloaded through the contents API rather than actions/checkout: this
      # is a single trusted file at the reusable's own commit, never PR code, and
      # a checkout step here trips CodeQL's untrusted-checkout heuristic.
      - name: Fetch analyst tooling
        env:
          TOOLING_REF: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          : "${TOOLING_REF:?job.workflow_sha is empty - cannot pin the resolver}"
          mkdir -p .ci-analyst-tooling/scripts
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/combsmith/.github-private/contents/scripts/ci-failure-analyst-resolve.sh?ref=${TOOLING_REF}" \
            > .ci-analyst-tooling/scripts/ci-failure-analyst-resolve.sh
          test -s .ci-analyst-tooling/scripts/ci-failure-analyst-resolve.sh

      # Resolves the head SHA, the non-fork PR and the failing run from either a
      # check_run payload (third-party checks) or a workflow_run payload (failed
      # GitHub Actions runs). Anything else ends in a "skipping" notice, exit 0.
      - name: Resolve non-fork PR
        id: pr
        run: bash .ci-analyst-tooling/scripts/ci-failure-analyst-resolve.sh resolve

      - name: Check idempotency
        if: steps.pr.outputs.skip == 'false'
        id: idem
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: bash .ci-analyst-tooling/scripts/ci-failure-analyst-resolve.sh idempotency

      - name: Install Claude Code
        if: steps.pr.outputs.skip == 'false' && steps.idem.outputs.exists == 'false'
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Fetch and sanitize logs
        if: steps.pr.outputs.skip == 'false' && steps.idem.outputs.exists == 'false'
        id: logs
        env:
          RUN_ID: ${{ steps.pr.outputs.run_id }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Fetch logs only in the Actions environment (not passed to Claude).
          # This prevents untrusted log content from reaching Claude's prompt.
          if [[ -n "$RUN_ID" ]]; then
            log_content=$(gh run view "$RUN_ID" --log-failed --repo "$REPO" 2>/dev/null | tail -200 || true)
          else
            log_content=$(gh pr diff "$PR_NUMBER" --repo "$REPO" 2>/dev/null | head -200 || true)
          fi
          # Sanitize: remove newlines and keep the LAST 2000 chars (where the failure usually is)
          sanitized_logs=$(printf '%s' "$log_content" | tr '\n' ' ' | tr -d '\r' | tail -c 2000)
          printf 'logs=%s\n' "$sanitized_logs" >> "$GITHUB_OUTPUT"

      - name: Analyze failure and post comment
        if: steps.pr.outputs.skip == 'false' && steps.idem.outputs.exists == 'false'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          WORKFLOW_NAME: ${{ steps.pr.outputs.check_name }}
          DETAILS_URL: ${{ steps.pr.outputs.details_url }}
          FAILED_JOBS: ${{ steps.pr.outputs.failed_jobs }}
          LOG_EXCERPT: ${{ steps.logs.outputs.logs }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.npm-global/bin:$PATH"

          # Sanitize untrusted variables to prevent prompt injection: remove newlines
          # and carriage returns from data that originated in GitHub Actions job output.
          WORKFLOW_NAME="$(printf '%s' "$WORKFLOW_NAME" | tr -d '\r\n')"
          FAILED_JOBS="$(printf '%s' "$FAILED_JOBS" | tr -d '\r\n')"

          cat > /tmp/prompt-template.txt << 'TMPL'
          A CI check named "$WORKFLOW_NAME" just failed on PR #$PR_NUMBER in repository $REPO.

          Key facts:
          - PR number: $PR_NUMBER
          - Head SHA: $HEAD_SHA
          - Workflow/check name: $WORKFLOW_NAME
          - Details URL: $DETAILS_URL
          - Failed jobs (job / failing step): $FAILED_JOBS

          Log excerpt (last 2000 chars):
          $LOG_EXCERPT

          Analyze the above information and follow these steps in order:

          ### 1. Identify the failing step and error
          From the log excerpt and failed jobs, extract:
          - The specific step name that failed
          - The key error message or assertion

          ### 2. Classify the root cause into exactly one category:
          | Category      | Indicators |
          |---|---|
          | Test failure  | Assertion failed, FAIL, AssertionError, Expected...got... |
          | Env issue     | Missing secret/env var, command not found, permission denied, auth error |
          | Flaky test    | Timeout, ECONNREFUSED, connection reset, intermittent HTTP error |
          | Config error  | Malformed YAML, missing required field, invalid syntax, wrong runner |
          | Lint/style    | eslint, shellcheck, markdownlint, yamllint, ruff, golangci-lint errors |
          | Build error   | Compilation error, npm ERR!, cargo build failed, dependency resolution failure |

          If the workflow name contains lint, shellcheck, markdownlint, yamllint, or similar -> must classify as Lint/style.

          ### 3. Post a comment on PR #$PR_NUMBER using bash:
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            -f body='<!-- ci-analyst sha=$HEAD_SHA -->
          ## CI Failure: $WORKFLOW_NAME

          **Step:** FAILING_STEP_NAME
          **Root cause:** ROOT_CAUSE_CATEGORY

          BRIEF_EXPLANATION (2-3 sentences: what failed, why it likely failed, what the error means)

          **Suggested fix:** ONE_CONCRETE_ACTION

          [View run logs]($DETAILS_URL)'

          Rules:
          - The <!-- ci-analyst sha=$HEAD_SHA --> marker MUST be the very first line of the comment body
          - Root cause must be one of the six categories above
          - Suggested fix must be one specific, actionable step (not "fix the tests")
          - Keep the entire comment under 300 words
          TMPL

          PROMPT=$(envsubst < /tmp/prompt-template.txt)
          _analyst_out=$(mktemp)
          _analyst_rc=0
          claude --print \
            --permission-mode bypassPermissions \
            --allowedTools Bash \
            --fallback-model opus \
            -p "$PROMPT" 2>&1 | tee "$_analyst_out" || _analyst_rc=${PIPESTATUS[0]}
          if [ "$_analyst_rc" -ne 0 ] && \
             grep -qiE "hit your.*(session )?limit|rate.?limit|session limit|usage limit|quota exceeded|too many requests" "$_analyst_out"; then
            echo "::notice::Claude rate-limited — skipping CI analysis for PR #${PR_NUMBER} (will retry on next CI failure)"
            rm -f "$_analyst_out"
            exit 0
          fi
          rm -f "$_analyst_out"
          exit "$_analyst_rc"
