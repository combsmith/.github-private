name: Repair PR Approvals

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (true) or apply repairs (false)"
        required: false
        default: "true"
        type: string

# Workflow-level token stays read-only; write scopes are granted per job below
# (least privilege, OpenSSF Scorecard Token-Permissions, #216).
permissions:
  contents: read

jobs:
  repair:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Repair PR approvals
        env:
          # Prefer the classic PAT (approvals need addPullRequestReview, which
          # fails for fine-grained PATs); fall back to fine-grained if unset.
          GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT_CLASSIC || secrets.DON_PETRY_BOT_GH_PAT }}
        run: bash scripts/repair-pr-approvals.sh "${{ inputs.dry_run }}"
