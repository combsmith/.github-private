name: Daily PR Review Health Check
# readme-report: Daily PR-review health check — flags PR-review agent failures as an issue.

on:
  schedule:
    # Daily at 06:13 UTC — covers same-day run history before US work hours
    - cron: '13 6 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of run history to inspect (time-based search)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-pr-review-health
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '1' }}
      # Pin via vars.CLAUDE_CODE_VERSION for reproducible caching; default
      # 'latest' caches an install indefinitely — flush via the Actions cache
      # UI or bump the variable to pick up new releases. Mirrors pr-review.yml.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}

    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      # AGENTS_PAUSED (#2249): the three CLI setup steps are skipped with the fleet
      # paused, like the two model-calling steps they serve (see "Run health check").
      - name: Resolve claude-code version
        if: vars.AGENTS_PAUSED != 'true'
        # A literal "latest" cache key never changes, so the first CLI ever cached
        # was reused indefinitely (2.1.138 outlived the Opus 5.5 launch — #1957).
        # Resolve it to the concrete npm version so a new release misses the cache,
        # and install exactly that version on a miss (never re-resolve "latest");
        # a pinned vars.CLAUDE_CODE_VERSION passes through unchanged.
        id: claude_code_version
        env:
          REQUESTED_VERSION: ${{ env.CLAUDE_CODE_VERSION || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          v="$REQUESTED_VERSION"
          install="$v"
          if [ "$v" = "latest" ]; then
            v="$(npm view @anthropic-ai/claude-code version 2>/dev/null || true)"
            if [ -n "$v" ]; then
              install="$v"
            else
              v="latest-$(date -u +%G-w%V)"
              echo "::warning::could not resolve the latest claude-code version; using weekly cache key $v"
            fi
          fi
          echo "claude-code cache version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "install=$install" >> "$GITHUB_OUTPUT"

      - name: Cache claude-code CLI
        if: vars.AGENTS_PAUSED != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ steps.claude_code_version.outputs.version }}-${{ runner.os }}

      - name: Install Claude Code CLI
        if: vars.AGENTS_PAUSED != 'true'
        env:
          CLAUDE_CODE_VERSION: ${{ steps.claude_code_version.outputs.install || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if command -v claude >/dev/null 2>&1; then
            echo "claude-code cache hit: $(claude --version)"
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # NOSONAR — install scripts required for native binary setup; version intentionally uses CLAUDE_CODE_VERSION var (same pattern as pr-review.yml)
          fi

      # AGENTS_PAUSED (#2249): this job is a monitor, so it keeps running through
      # a fleet pause, but its two model calls do not. The pr-review log analysis
      # (this step) and the MCP connectivity probe (last step) are skipped with
      # the fleet paused; the runaway, stall and merge-ready scans below make no
      # model call and still run. Before this gate a quota outage failed this
      # step and took those scans down with it.
      - name: Run health check
        if: vars.AGENTS_PAUSED != 'true'
        env:
          GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
          # Export the model override variable so ai_model_for_family honours
          # operator-configured model chains (vars.AI_MODELS_CLAUDE).
          AI_MODELS_CLAUDE: ${{ vars.AI_MODELS_CLAUDE }}
          # The other break-glass overrides, so the report lists every one that
          # differs from config/ai-engines.json (#1973).
          AI_MODELS_GEMINI: ${{ vars.AI_MODELS_GEMINI }}
          AI_MODELS_COPILOT: ${{ vars.AI_MODELS_COPILOT }}
          AI_ENGINES: ${{ vars.AI_ENGINES || vars.DEV_LEAD_ENGINES || '' }}
        run: bash scripts/pr_review_health.sh

      - name: Truncate report if needed
        run: |
          if [ -f pr_review_health_report.md ]; then
            if [ "$(wc -c < pr_review_health_report.md)" -gt 60000 ]; then
              head -c 60000 pr_review_health_report.md > pr_review_health_report.md.tmp
              mv pr_review_health_report.md.tmp pr_review_health_report.md
              printf '\n\n---\n_Report truncated at 60 000 bytes._\n' >> pr_review_health_report.md
            fi
          fi

      - name: Create issue with findings
        if: env.HAS_FAILURES == 'true' && hashFiles('pr_review_health_report.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('pr_review_health_report.md', 'utf8');
            if (!report.trim()) {
              core.setFailed('Report file is empty');
              return;
            }
            const today = new Date().toISOString().split('T')[0];
            const titlePrefix = 'PR Review Agent — failures detected';
            // Date-stamped title → a fresh issue every run (20 had piled up open).
            // Close prior open digests before opening today's snapshot.
            const priors = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-check,automated-report', per_page: 100,
            });
            for (const p of priors) {
              if (!p.pull_request && p.title.startsWith(titlePrefix)) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: p.number, state: 'closed', state_reason: 'completed',
                  });
                } catch (err) { core.warning(`could not close prior digest #${p.number}: ${err.message}`); }
              }
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titlePrefix} ${today}`,
              body: report,
              labels: ['health-check', 'automated-report'],
            });
            core.notice(`Issue created: ${issue.data.html_url}`);

      - name: Annotate clean run
        # Not while paused (#2249): the health check did not run, so there is
        # no clean result to announce.
        if: vars.AGENTS_PAUSED != 'true' && env.HAS_FAILURES != 'true'
        run: |
          echo "::notice::Health check passed — all runs in the last ${LOOKBACK_DAYS} day(s) are healthy."

      # Runaway-PR detection net (#948, #860 follow-up). Pure gh-API + jq scan of
      # every open PR against soft, env-overridable thresholds — no LLM, no PR
      # mutation. #860 ran for four days unnoticed; this makes the next novel
      # runaway a push signal on day one. Sets HAS_RUNAWAY when any candidate is
      # found, surfaced through the same health-check / automated-report issue
      # channel below.
      - name: Scan for runaway PRs
        env:
          GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
          REPO: ${{ github.repository }}
        run: bash scripts/pr_runaway_scan.sh

      - name: Truncate runaway report if needed
        run: |
          if [ -f pr_runaway_report.md ]; then
            if [ "$(wc -c < pr_runaway_report.md)" -gt 60000 ]; then
              head -c 60000 pr_runaway_report.md > pr_runaway_report.md.tmp
              mv pr_runaway_report.md.tmp pr_runaway_report.md
              printf '\n\n---\n_Report truncated at 60 000 bytes._\n' >> pr_runaway_report.md
            fi
          fi

      - name: Create runaway-candidate issue
        if: env.HAS_RUNAWAY == 'true' && hashFiles('pr_runaway_report.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('pr_runaway_report.md', 'utf8');
            if (!report.trim()) {
              core.setFailed('Runaway report file is empty');
              return;
            }
            const today = new Date().toISOString().split('T')[0];
            const titlePrefix = 'Runaway PR candidate(s) detected';
            // Date-stamped title → a fresh issue every run. Close prior open ones.
            const priors = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-check,automated-report', per_page: 100,
            });
            for (const p of priors) {
              if (!p.pull_request && p.title.startsWith(titlePrefix)) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: p.number, state: 'closed', state_reason: 'completed',
                  });
                } catch (err) { core.warning(`could not close prior digest #${p.number}: ${err.message}`); }
              }
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titlePrefix} ${today}`,
              body: report,
              labels: ['health-check', 'automated-report'],
            });
            core.notice(`Runaway issue created: ${issue.data.html_url}`);

      # Stall-PR detection net (#1410, epic #1402). The mirror image of the
      # runaway scan above: a pure gh-API + jq sweep of every open PR for the
      # SILENT failure mode the narrowed Class-2 timers (#1407/#1408) could
      # introduce — a PR stuck CI-green + REVIEW_REQUIRED with no agent activity
      # and no pending event, that no fast path re-fires. #860's lesson was that
      # detection must be pushed, not pulled; this builds that instrument BEFORE
      # the timers narrow. Detect-only — no PR is mutated. Sets HAS_STALL when any
      # candidate is found, surfaced through the same health-check /
      # automated-report issue channel. No new scheduled workload.
      - name: Scan for stalled PRs
        env:
          GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
          REPO: ${{ github.repository }}
        run: bash scripts/pr_stall_scan.sh

      - name: Truncate stall report if needed
        run: |
          if [ -f pr_stall_report.md ]; then
            if [ "$(wc -c < pr_stall_report.md)" -gt 60000 ]; then
              last_line=$(awk '{s+=length($0)+1; if(s>60000){print NR-1; exit}} END{if(s<=60000) print NR}' pr_stall_report.md)
              last_line=$((last_line > 0 ? last_line : 1))
              head -n "${last_line}" pr_stall_report.md > pr_stall_report.md.tmp
              mv pr_stall_report.md.tmp pr_stall_report.md
              printf '\n\n---\n_Report truncated at 60 000 bytes._\n' >> pr_stall_report.md
            fi
          fi

      - name: Create stall-candidate issue
        if: env.HAS_STALL == 'true' && hashFiles('pr_stall_report.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('pr_stall_report.md', 'utf8');
            if (!report.trim()) {
              core.setFailed('Stall report file is empty');
              return;
            }
            const today = new Date().toISOString().split('T')[0];
            const titlePrefix = 'Stalled PR candidate(s) detected';
            // Date-stamped title → a fresh issue every run. Close prior open ones.
            const priors = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-check,automated-report', per_page: 100,
            });
            for (const p of priors) {
              if (!p.pull_request && p.title.startsWith(titlePrefix)) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: p.number, state: 'closed', state_reason: 'completed',
                  });
                } catch (err) { core.warning(`could not close prior digest #${p.number}: ${err.message}`); }
              }
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titlePrefix} ${today}`,
              body: report,
              labels: ['health-check', 'automated-report'],
            });
            core.notice(`Stall issue created: ${issue.data.html_url}`);

      # Merge-ready-and-idle detection net (#1469, epic #1402). The third member of
      # the runaway (#948) / stall (#1410) detection family: a pure gh-API + jq sweep
      # of every open PR for the SILENT failure mode #1451 sat in for 77h — APPROVED
      # + MERGEABLE + green on required checks, yet idle with no agent acting and
      # nothing reporting it. It classifies this DISTINCTLY from #1425 (agent-blocked
      # by an untrusted-bot thread) and #1427 (reviewer deferring on a pending check),
      # neither of which is double-counted. Detect-only — no PR is mutated, nudged, or
      # auto-merged (a well-meaning nudge can itself re-arm the churn this epic fights,
      # see #1427 Case A). Sets HAS_MERGEREADY when any candidate is found, surfaced
      # through the same health-check / automated-report issue channel. No new
      # scheduled workload.
      - name: Scan for merge-ready idle PRs
        env:
          GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
          REPO: ${{ github.repository }}
        run: bash scripts/pr_mergeready_scan.sh

      - name: Truncate merge-ready report if needed
        run: |
          if [ -f pr_mergeready_report.md ]; then
            if [ "$(wc -c < pr_mergeready_report.md)" -gt 60000 ]; then
              last_line=$(awk '{s+=length($0)+1; if(s>60000){print NR-1; exit}} END{if(s<=60000) print NR}' pr_mergeready_report.md)
              last_line=$((last_line > 0 ? last_line : 1))
              head -n "${last_line}" pr_mergeready_report.md > pr_mergeready_report.md.tmp
              mv pr_mergeready_report.md.tmp pr_mergeready_report.md
              printf '\n\n---\n_Report truncated at 60 000 bytes._\n' >> pr_mergeready_report.md
            fi
          fi

      - name: Create merge-ready-candidate issue
        if: env.HAS_MERGEREADY == 'true' && hashFiles('pr_mergeready_report.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('pr_mergeready_report.md', 'utf8');
            if (!report.trim()) {
              core.setFailed('Merge-ready report file is empty');
              return;
            }
            const today = new Date().toISOString().split('T')[0];
            const titlePrefix = 'Merge-ready but idle PR candidate(s) detected';
            // Date-stamped title → a fresh issue every run. Close prior open ones.
            const priors = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-check,automated-report', per_page: 100,
            });
            for (const p of priors) {
              if (!p.pull_request && p.title.startsWith(titlePrefix)) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: p.number, state: 'closed', state_reason: 'completed',
                  });
                } catch (err) { core.warning(`could not close prior digest #${p.number}: ${err.message}`); }
              }
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titlePrefix} ${today}`,
              body: report,
              labels: ['health-check', 'automated-report'],
            });
            core.notice(`Merge-ready issue created: ${issue.data.html_url}`);

      # Durable, affirmative MCP-connectivity monitor (#903, part of #676).
      # Additive final step: when .github/review-mcp.json is present, assert that
      # the configured server(s) handshake through the same flags engine.sh uses
      # and FAIL the health check if MCP is configured but unreachable. The
      # hashFiles guard makes this a no-op for non-MCP repos. REVIEW_MCP_DEBUG=1
      # reuses the #892 knob so the affirmative ::notice::[mcp] is the success signal.
      - name: Assert MCP connectivity
        if: vars.AGENTS_PAUSED != 'true' && hashFiles('.github/review-mcp.json') != ''
        env:
          REVIEW_MCP_DEBUG: '1'
        run: bash scripts/mcp_connectivity_check.sh

      # Fleet pause notice (#2249): one line saying which steps the pause skipped.
      # `always()` so a scan failing above does not silence it, which is also why
      # it does not claim the scans ran: it only says they are not paused. The job-level
      # Claude credential is blanked: this step only prints a line.
      - name: Report the fleet pause
        if: always() && vars.AGENTS_PAUSED == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ''
          PAUSE_SOURCE: ${{ vars.AGENTS_PAUSE_SOURCE }}
          PAUSE_UNTIL: ${{ vars.AGENTS_PAUSE_UNTIL }}
        run: |
          echo "::notice title=Agent fleet paused::Daily PR Review Health Check: the agent fleet is paused (AGENTS_PAUSED=true)," \
            "so the pr-review log analysis and the MCP connectivity probe were skipped." \
            "The runaway, stall and merge-ready scans are not paused; see their own steps for whether they ran." \
            "Pause source: ${PAUSE_SOURCE:-not set (paused by hand)}." \
            "Paused until: ${PAUSE_UNTIL:-not set}."
