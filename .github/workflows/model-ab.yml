name: Model A/B (non-regression)
# readme-report: Manually dispatched Opus 5.5 vs 4.8 held-out A/B + liveness/effort probe.

# Phase 2 of the deep-tier promotion epic (#1895, story #1950; unblocks #1899 and
# #1901). #1897 was closed with OFFLINE evidence only — its live ACs (AC-1 A/B,
# AC-3 liveness, AC-4 effort probe) were "recorded as requiring a live CI run",
# but no workflow in this repo runs scripts/evals/model-ab.sh (skill-eval-report.yml
# runs run-eval.sh for ONE skill at a fixed model). So the epic's non-regression
# metric — `model-ab.sh claude-opus-5-5 claude-opus-4-8` exits 0 — had no execution  # model-pin-ok: A/B test non-regression metric for #1950, #1978, #1979
# path. This workflow gives it one.
#
# workflow_dispatch ONLY (no schedule, no pull_request): every run spends tokens
# (2 models x N held-out sets, plus a live probe), so it is a deliberate maintainer
# action, never automatic. The maintainer's session dispatches it once after merge
# with the defaults below (see #1950 maintainer decision) — do NOT dispatch it from
# the PR.
#
# EVAL SAFEGUARD (unchanged from #1897): frozen held-out sets, judge held fixed at
# the AB_JUDGE_MODEL default, and each skill markdown at its incumbent file. There
# is deliberately NO prompt or corpus override input — the corpus and judge are not
# tunable from the dispatch.
#
# Class: org-private-automation (like skill-eval-report.yml), NOT a thin caller
# stub. Third-party actions are SHA-pinned (pins copied from skill-eval-report.yml
# per AGENTS.md — never guessed).

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate (new) model id to score against the incumbent"
        required: false
        default: "claude-opus-5-5"  # model-pin-ok: A/B test requires specific model versions for non-regression check (#1950, #1978, #1979)
        type: string
      incumbent:
        description: "Incumbent (current) model id — the non-regression baseline"
        required: false
        default: "claude-opus-4-8"  # model-pin-ok: A/B test requires specific model versions for non-regression check (#1950, #1978, #1979)
        type: string
      sets:
        description: "Space-separated held-out sets; each must have evals/<set>/holdout (frozen sets only)"
        required: false
        default: "triage deep-review"
        type: string
      runs:
        description: "Max attempts per A/B (clamped 1..3, the epic cost cap); ONLY infra-classed runs are retried"
        required: false
        default: "1"
        type: string

# Least-privilege: reset the default write-all grant to nothing at the top level;
# the single job re-grants only the read scope it needs (AC #5).
permissions: {}

# One A/B per ref at a time; never cancel a token-spending run mid-flight.
concurrency:
  group: model-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model-ab:
    # AGENTS_PAUSED (#1525, #2249): with the fleet paused this job is skipped
    # (neutral, not red) and `fleet-paused` below reports why.
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    # Budget (AC #5): the default matrix is 2 models x {triage (5 cases, 1 call) +
    # deep-review (5 cases, generator + judge = 2 calls)} = 30 sequential model
    # calls, all driven through run_triage and so each bounded by TRIAGE_TIMEOUT_SEC
    # — hard-bounded: engine.sh runs every CLI call under `timeout --kill-after`, so a
    # call that ignores SIGTERM is SIGKILLed after ENGINE_KILL_AFTER and can never
    # outlive its budget (the probes likewise, by PROBE_TIMEOUT_SECS with --kill-after).
    # The dispatcher re-runs the
    # WHOLE matrix on an all-infra attempt, up to `runs` (clamped 1..3), so the
    # worst-case wall time is runs x 30 calls, NOT 30 — the retry multiplier must fit
    # the job timeout too (#1952, cubic P1). At the stock 300s/call the matrix alone
    # is 150 min and runs=3 is 450 min, which exceeds GitHub's 360-min job ceiling, so
    # a tighter per-call budget is pinned for THIS job via TRIAGE_TIMEOUT_SEC below:
    # 180s is still several times a triage/judge call's typical latency, and a call
    # killed at 180s classes INFRA (re-run, never a false regression) — so the tighter
    # bound costs at worst an inconclusive run, never a wrong verdict. Worst case
    # MUST count the per-call kill grace (the earlier 280-min figure omitted it, which
    # CodeRabbit flagged): a SIGTERM-ignoring call runs TRIAGE_TIMEOUT_SEC +
    # ENGINE_KILL_AFTER (180s + 30s) before `timeout` SIGKILLs it, so the retried
    # matrix is 3 x 30 x 210s = 315 min; the two probes at PROBE_TIMEOUT_SECS +
    # PROBE_KILL_AFTER (300s + 30s) run once = 11 min; plus a few min of checkout/
    # install/validate setup ~= 330 min. timeout-minutes is pinned at 345 so the job
    # can always return its verdict on the clamped-max runs=3 retry path, while still
    # staying under GitHub's 360-min job ceiling (#1952 CodeRabbit).
    timeout-minutes: 345
    permissions:
      contents: read  # actions/checkout only — this workflow writes nothing
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Pin via vars.CLAUDE_CODE_VERSION for reproducible caching; default 'latest'
      # caches an install indefinitely — flush via the Actions cache UI or bump the
      # variable. Mirrors skill-eval-report.yml / pr-review.yml.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
      CANDIDATE: ${{ inputs.candidate }}
      INCUMBENT: ${{ inputs.incumbent }}
      SETS: ${{ inputs.sets }}
      RUNS: ${{ inputs.runs }}
      # Per-call budget for the A/B matrix (every arm runs through run_triage). Pinned
      # tighter than engine.sh's 300s stock so runs x 30 calls fits timeout-minutes
      # above even on the clamped-max runs=3 retry path (#1952, cubic P1). A call that
      # overruns this classes INFRA (re-run), never a false regression.
      TRIAGE_TIMEOUT_SEC: "180"
      # Every arm (both models, both sets) logs per-call token records to this
      # single JSONL, giving #1899 cost figures for both models on IDENTICAL inputs
      # (AC #3). engine.sh honors TOKEN_LOG_FILE; unset would be a silent no-op.
      TOKEN_LOG_FILE: ${{ github.workspace }}/model-ab-tokens.jsonl

    steps:
      - name: Reject non-main dispatch ref
        # workflow_dispatch can target ANY branch or tag, but this A/B produces the
        # official go/no-go evidence for the deep-tier promotion — it must score the
        # MERGED main tree, never a stale or unreviewed branch's scripts/prompts/
        # corpus. Fail closed (AGENTS.md #1776) on any ref other than main so branch
        # state can never masquerade as post-merge evidence (#1952).
        env:
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$GH_REF" != "refs/heads/main" ]; then
            echo "::error::model-ab must be dispatched from main (got '$GH_REF') — the A/B scores the merged tree, not branch state"
            exit 1
          fi

      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The non-main guard above already rejects any ref but main; pin the
          # checkout to github.sha (the exact main commit that triggered this
          # dispatch) rather than refs/heads/main, so a push that lands between
          # dispatch and checkout cannot swap the scored tree out from under the
          # run — the evidence is tied to one reviewed commit (#1952).
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate dispatch inputs (offline — spends no tokens)
        # Run the wrapper's OFFLINE input validation (runs clamp + set existence /
        # dedup / count-cap / engine-compat) BEFORE the paid liveness/effort probe,
        # so a fat-fingered dispatch (unknown, duplicated, or persona-engine set) is
        # rejected without spending a single model token (#1952). This reuses the
        # exact logic the A/B step depends on — one source of truth, no drift.
        run: |
          set -euo pipefail
          bash scripts/evals/model-ab-dispatch.sh --validate-only \
            --candidate "$CANDIDATE" \
            --incumbent "$INCUMBENT" \
            --sets "$SETS" \
            --runs "$RUNS"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Resolve claude-code version
        # A literal "latest" cache key never changes, so the first CLI ever cached
        # was reused indefinitely (2.1.138 outlived the Opus 5.5 launch — #1957).
        # Resolve it to the concrete npm version so a new release misses the cache,
        # and install exactly that version on a miss (never re-resolve "latest");
        # a pinned vars.CLAUDE_CODE_VERSION passes through unchanged (#1952, mirrors
        # skill-eval-report.yml).
        id: claude_code_version
        env:
          REQUESTED_VERSION: ${{ env.CLAUDE_CODE_VERSION || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          v="$REQUESTED_VERSION"
          install="$v"
          if [ "$v" = "latest" ]; then
            v="$(npm view @anthropic-ai/claude-code version 2>/dev/null || true)"
            if [ -n "$v" ]; then
              install="$v"
            else
              v="latest-$(date -u +%G-w%V)"
              echo "::warning::could not resolve the latest claude-code version; using weekly cache key $v"
            fi
          fi
          echo "claude-code cache version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "install=$install" >> "$GITHUB_OUTPUT"

      - name: Cache claude-code CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ steps.claude_code_version.outputs.version }}-${{ runner.os }}

      - name: Install Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: ${{ steps.claude_code_version.outputs.install || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if command -v claude >/dev/null 2>&1; then
            echo "claude-code cache hit: $(claude --version)"
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # NOSONAR — install scripts required for native binary setup; version intentionally uses CLAUDE_CODE_VERSION var (same pattern as skill-eval-report.yml)
          fi

      - name: Liveness & effort probe
        id: probe
        # AC #4: prove the candidate model actually ANSWERS in CI (closing #1897's
        # AC-3), and record whether `--effort high` is accepted (AC-4). This is a
        # LIVENESS probe, so it fails OPEN (continue-on-error) with a loud finding
        # in the summary — it must never mask the A/B verdict, which is the run's
        # exit status (AC #2). Per AGENTS.md #1776: liveness probes warn, gates fail.
        continue-on-error: true
        run: |
          set -uo pipefail
          # shellcheck source=scripts/lib/token-metrics.sh
          source scripts/lib/token-metrics.sh
          prompt="Reply with the single word: pong."

          # Bound EACH probe so a stalled `claude` call cannot consume the whole
          # job timeout and starve the A/B step: on job cancellation the A/B
          # never runs, and continue-on-error (which applies only AFTER a step
          # finishes) would NOT save it (#1952, codex P1). `timeout` exits 124 on
          # expiry — a nonzero rc the liveness/effort checks below already treat as
          # FAIL / rejected-or-unsupported, so the probe fails OPEN and the A/B
          # still produces its verdict. --kill-after sends SIGKILL if the CLI
          # ignores the initial SIGTERM, so a wedged process can't outlive the
          # bound and keep starving the job (#1952).
          probe_timeout="${PROBE_TIMEOUT_SECS:-300}"
          probe_kill_after="${PROBE_KILL_AFTER:-30s}"

          # 1) Liveness: does the candidate answer at all?
          live_rc=0
          timeout --kill-after="$probe_kill_after" "$probe_timeout" claude --print --model "$CANDIDATE" --output-format json <<<"$prompt" > probe.json 2>probe.err || live_rc=$?
          # extract_engine_text returns nonzero when jq cannot parse the probe file;
          # sourcing token-metrics.sh enabled errexit, so an unguarded assignment
          # would abort the step before it records the result or writes the summary.
          # Capture the status and leave the text empty so the check records FAIL.
          if ! result_txt="$(extract_engine_text claude probe.json)"; then
            result_txt=""
          fi
          if [ "$live_rc" -eq 0 ] && [ -n "$result_txt" ]; then
            liveness="PASS"
          else
            liveness="FAIL"
          fi
          echo "liveness=$liveness" >> "$GITHUB_OUTPUT"

          # 2) Effort probe: is `--effort high` accepted by this model/CLI?
          effort_rc=0
          timeout --kill-after="$probe_kill_after" "$probe_timeout" claude --print --model "$CANDIDATE" --effort high --output-format json <<<"$prompt" > effort.json 2>effort.err || effort_rc=$?
          # Same errexit guard as the liveness assignment above (#1952 CodeRabbit).
          if ! effort_txt="$(extract_engine_text claude effort.json)"; then
            effort_txt=""
          fi
          if [ "$effort_rc" -eq 0 ] && [ -n "$effort_txt" ]; then
            effort="accepted"
          else
            effort="rejected-or-unsupported"
          fi
          echo "effort=$effort" >> "$GITHUB_OUTPUT"

          {
            echo "## Candidate liveness & effort probe — \`$CANDIDATE\`"
            echo ""
            echo "| check | result |"
            echo "|-------|--------|"
            echo "| liveness (\`--print\`, \`.result\` non-empty via extract_engine_text) | **$liveness** |"
            echo "| \`--effort high\` accepted | **$effort** |"
            echo ""
            if [ "$liveness" != "PASS" ]; then
              echo "> :warning: Liveness probe did NOT pass — the candidate produced no parseable \`.result\`. The A/B below will likely classify \`infra\`."
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$liveness" != "PASS" ]; then
            echo "::warning::model-ab probe: candidate '$CANDIDATE' liveness FAIL (rc=$live_rc, empty .result) — recorded, non-blocking"
          fi

      - name: Run model A/B (retry infra only)
        id: ab
        # AC #2: run model-ab.sh <candidate> <incumbent> <sets…> via the dispatch
        # helper, which validates/clamps inputs (AC #1) and re-runs ONLY infra-classed
        # attempts (exit 2), up to `runs`, never re-running a scored verdict. The
        # workflow's exit status IS model-ab.sh's verdict (0 accept / 1 regression /
        # 2 infra) — we render the summary first, then propagate it.
        run: |
          set -uo pipefail
          rc=0
          bash scripts/evals/model-ab-dispatch.sh \
            --candidate "$CANDIDATE" \
            --incumbent "$INCUMBENT" \
            --sets "$SETS" \
            --runs "$RUNS" \
            --out model-ab-evidence.json || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          {
            echo "## Model A/B — \`$CANDIDATE\` (candidate) vs \`$INCUMBENT\` (incumbent)"
            echo ""
            if [ -f model-ab-evidence.json ] && jq -e . model-ab-evidence.json >/dev/null 2>&1; then
              verdict=$(jq -r '.verdict'      model-ab-evidence.json)
              judge=$(jq -r '.judge_model'    model-ab-evidence.json)
              echo "- **Verdict:** \`$verdict\` (candidate must MATCH OR BEAT incumbent on every set; bar is \`>=\`, not a strict improvement gate)"
              echo "- **Judge model (held fixed):** \`$judge\`"
              echo "- **Attempts:** run budget \`$RUNS\` (clamped 1..3); only infra-classed attempts are retried, a scored arm is never re-run"
              echo ""
              echo "| set | candidate score | incumbent score | non-regression | outcome |"
              echo "|-----|-----------------|-----------------|----------------|---------|"
              jq -r '.sets[] | "| `\(.skill)` | \(.candidate_score) | \(.incumbent_score) | \(.non_regression) | \(.outcome) |"' model-ab-evidence.json
              echo ""
            else
              echo "> :warning: model-ab.sh produced no parseable evidence JSON (rc=$rc) — likely a hard/usage error; see the step log."
              echo ""
            fi
            echo "### Caveats"
            echo "- **EVAL SAFEGUARD:** frozen held-out sets, judge held fixed (\`AB_JUDGE_MODEL\`), skill markdown at its incumbent file. No prompt/corpus override is accepted by this workflow."
            echo -n "- **Effort NOT exercised in the A/B:** \`model-ab.sh\` drives the deep-review generator through \`run_triage\`, so it does **not** apply the deep tier's \`--effort high\` pin that #1898 added to \`run_agentic\`. "
            echo "Do not over-read this A/B as covering the deep tier's effort setting — the effort finding above is a separate direct probe."
          } >> "$GITHUB_STEP_SUMMARY"

          # Propagate model-ab.sh's verdict as the job's exit status (AC #2).
          exit "$rc"

      - name: Upload A/B evidence JSON
        # The machine-readable go/no-go record (verdict, per-set scores, judge model)
        # that backs the epic's non-regression metric — upload it as a durable
        # artifact, not just the rendered step summary. always() so a regression (rc=1)
        # or infra (rc=2) run still surfaces its evidence instead of discarding it;
        # the exit status is the gate, the artifact is the receipt (#1952).
        if: always() && hashFiles('model-ab-evidence.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: model-ab-evidence-${{ github.run_id }}
          path: model-ab-evidence.json
          if-no-files-found: warn

      - name: Upload per-arm token log
        # AC #3: the identical-inputs token JSONL for BOTH models — #1899's cost
        # (and, once duration_ms lands, latency) evidence. always() so it uploads
        # even when the A/B step exited non-zero (regression/infra).
        if: always() && hashFiles('model-ab-tokens.jsonl') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: model-ab-tokens-${{ github.run_id }}
          path: model-ab-tokens.jsonl
          if-no-files-found: warn

  # Fleet pause notice (#2249). With AGENTS_PAUSED=true the `model-ab` job above is
  # skipped by its `if:`, and a skipped job cannot log. This job runs instead, on
  # the same events, and says why in one line. Inventory and rules: AGENTS.md
  # "Pausing the agent fleet" and scripts/lib/fleet-pause-registry.tsv.
  fleet-paused:
    if: vars.AGENTS_PAUSED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      PAUSE_SOURCE: ${{ vars.AGENTS_PAUSE_SOURCE }}
      PAUSE_UNTIL: ${{ vars.AGENTS_PAUSE_UNTIL }}
    steps:
      - name: Report the fleet pause
        run: |
          echo "::notice title=Agent fleet paused::Model A/B: not run, the agent fleet is paused (AGENTS_PAUSED=true)." \
            "Pause source: ${PAUSE_SOURCE:-not set (paused by hand)}." \
            "Paused until: ${PAUSE_UNTIL:-not set}."
