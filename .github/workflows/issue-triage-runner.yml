name: Issue Triage
# readme-agent: Issue triage agent — labels and routes newly opened issues.

on:
  issues:
    types: [opened, reopened]

# Two-job pattern: triage runs with read-only issue access and produces a
# staged JSON artifact; apply runs with write access and calls safe-output.
permissions: {}  # Reset to none; each job declares its own scoped block below.

jobs:
  triage:
    # AGENTS_PAUSED (#1525, #2249): with the fleet paused this job is skipped
    # (neutral, not red) and `fleet-paused` below reports why.
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.run.outputs.result }}
      skip: ${{ steps.run.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install claude CLI
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi

      - name: Install Python dependencies
        run: |
          pip install "pyyaml==6.0.3" --only-binary=":all:" --quiet

      - name: Run issue-triage (staged)
        id: run
        env:
          # Operator model override for aw.sh's family resolver (#1979).
          AI_MODELS_CLAUDE: ${{ vars.AI_MODELS_CLAUDE || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_ACTION: ${{ github.event.action }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          result=$(bash scripts/aw.sh run issue-triage --staged)
          skip=$(AW_RESULT="$result" python3 -c "import json,os; d=json.loads(os.environ['AW_RESULT']); print('true' if d.get('skip') else 'false')")
          # Store encoded to survive multi-line JSON in GITHUB_OUTPUT
          encoded=$(printf '%s\n' "$result" | base64 -w0)
          echo "result=$encoded" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  apply:
    needs: triage
    if: needs.triage.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python dependencies
        run: |
          pip install "pyyaml==6.0.3" --only-binary=":all:" --quiet

      - name: Apply triage output (safe-output)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIAGE_RESULT: ${{ needs.triage.outputs.result }}
        run: |
          result_file=$(mktemp)
          printf '%s\n' "$TRIAGE_RESULT" | base64 -d > "$result_file"
          bash scripts/aw.sh safe-output apply issue-triage "$result_file"
          rm -f "$result_file"

  # Fleet pause notice (#2249). With AGENTS_PAUSED=true the `triage` job above is
  # skipped by its `if:`, and a skipped job cannot log. This job runs instead, on
  # the same events, and says why in one line. Inventory and rules: AGENTS.md
  # "Pausing the agent fleet" and scripts/lib/fleet-pause-registry.tsv.
  fleet-paused:
    if: vars.AGENTS_PAUSED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      PAUSE_SOURCE: ${{ vars.AGENTS_PAUSE_SOURCE }}
      PAUSE_UNTIL: ${{ vars.AGENTS_PAUSE_UNTIL }}
    steps:
      - name: Report the fleet pause
        run: |
          echo "::notice title=Agent fleet paused::Issue Triage: not run, the agent fleet is paused (AGENTS_PAUSED=true)." \
            "Pause source: ${PAUSE_SOURCE:-not set (paused by hand)}." \
            "Paused until: ${PAUSE_UNTIL:-not set}."
