# ─────────────────────────────────────────────────────────────────────────────
# CodeQL — advanced setup (#1871, merge-queue prerequisite for #1864)
#
# WHY THIS EXISTS: code scanning was previously GitHub **default setup**, which
# analyzes `push` and `pull_request` only and can never post a result to the
# merge queue's `gh-readonly-queue/*` ref — default setup cannot be given extra
# triggers. So the required `CodeQL` check and a working merge queue were
# mutually exclusive (github/codeql-action#1537). This advanced-setup workflow
# adds the `merge_group` trigger so the `CodeQL` status check reports on the
# queue ref, while preserving the prior default-setup coverage: languages
# `actions` + `python`, `extended` (security-extended) query suite.
#
# ⚠️ REQUIRED MANUAL CUTOVER (repository setting, not a file change): when this
# lands, **disable code-scanning default setup** in
# Settings → Code security → Code scanning (set "CodeQL analysis" to advanced /
# disable default setup). Otherwise default and advanced setup both run.
#
# The required-check context produced here is `CodeQL` (the code-scanning
# results check the upload-sarif step uploads) — do NOT rename it; the branch/merge-
# queue ruleset matches the required check by context name.
# ─────────────────────────────────────────────────────────────────────────────
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required status check: must report on the merge queue's gh-readonly-queue/*
  # ref, or the queue wedges (#1871, prerequisite for #1864).
  merge_group:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Required for github/codeql-action/analyze to upload SARIF results in
      # private/internal repositories; without it the CodeQL check fails.
      actions: read
      # Needed to fetch internal/private CodeQL packs when applicable.
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Preserve the language set from the prior default setup.
        language: [actions, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: ${{ matrix.language }}
          # `actions` and `python` are interpreted — no compilation step.
          build-mode: none
          # Matches the prior default-setup "extended" suite.
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          category: /language:${{ matrix.language }}
          # Upload after the filter below. `failure-only` still sends a failed
          # run's debugging data, as GitHub advises when post-processing SARIF.
          upload: failure-only
          output: ${{ runner.temp }}/codeql-sarif
      # The filter runs from the base branch's copy of the script, never the pull
      # request's, so an edit to it counts only after merge (bats tests the
      # edit before then). No pull request code runs in this job: analyze
      # extracts without building.
      - name: Check out the base branch's filter script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          path: .codeql-filter-base
          sparse-checkout: scripts/codeql-filter-org-pins.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The org pins its own reusable workflows to moving channel tags on purpose
      # (combsmith/.github ci-standards.md, "Exception: Internal Reusable Workflow
      # References"). Drop `actions/unpinned-tag` results on `combsmith/` refs
      # only; third-party tag pins and every other result are kept (Maintainer,
      # 2026-11-24). A SARIF the script cannot read fails this step, so nothing
      # is uploaded and the CodeQL check goes red.
      - name: Drop unpinned-tag results on org refs
        env:
          ORG: combsmith
          SARIF_IN: ${{ runner.temp }}/codeql-sarif/${{ matrix.language }}.sarif
          SARIF_OUT: ${{ runner.temp }}/codeql-sarif-filtered/${{ matrix.language }}.sarif
          FILTER: .codeql-filter-base/scripts/codeql-filter-org-pins.sh
        run: |
          mkdir -p "$(dirname "$SARIF_OUT")"
          if [[ -f "$FILTER" ]]; then
            bash "$FILTER" "$SARIF_IN" "$SARIF_OUT" "$GITHUB_WORKSPACE"
          else
            # The base branch has no filter yet: upload every result.
            echo "::notice::no filter script on the base branch; uploading unfiltered results"
            cp "$SARIF_IN" "$SARIF_OUT"
          fi
      # A check on the script's output, kept in the workflow so a faulty script
      # cannot hide a result: everything outside the results is unchanged, no
      # result is added, every result of another rule is unchanged, and each
      # unpinned-tag result that went missing names a `combsmith/` ref, run by
      # run (a run is a category).
      - name: Check that only org-ref unpinned-tag results were dropped
        env:
          SARIF_IN: ${{ runner.temp }}/codeql-sarif/${{ matrix.language }}.sarif
          SARIF_OUT: ${{ runner.temp }}/codeql-sarif-filtered/${{ matrix.language }}.sarif
        run: |
          jq -e --slurpfile out "$SARIF_OUT" '
            def rule: .ruleId // .rule.id // "";
            def tag: "actions/unpinned-tag";
            def others: [.runs[] | [(.results // [])[] | select(rule != tag)]];
            def tags: [.runs[] | [(.results // [])[] | select(rule == tag)]];
            def org_ref: (.message.text // "")
              | test("(\\]\\([0-9]+\\) uses|\u0027 uses reusable workflow) \u0027combsmith/[^\u0027\\s]+\u0027 with ref \u0027[^\u0027]*\u0027, not a pinned commit hash$"; "i");
            $out[0] as $o
            | (del(.runs[].results) == ($o | del(.runs[].results)))
              and (others == ($o | others))
              and ([tags, ($o | tags)] | transpose | all(
                    .[0] as $was | .[1] as $now
                    | ($now - $was == [])
                      and (($was - $now) | length) == (($was | length) - ($now | length))
                      and (($was - $now) | all(org_ref))))' "$SARIF_IN" > /dev/null
      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-filtered/${{ matrix.language }}.sarif
          category: /language:${{ matrix.language }}

  CodeQL:
    name: CodeQL
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fail closed: only a fully successful matrix passes. `cancelled` and
      # `skipped` runs completed no scan, so they must not report green.
      - env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "${ANALYZE_RESULT}" != "success" ]]; then
            echo "CodeQL analyze result: ${ANALYZE_RESULT} (expected success)" >&2
            exit 1
          fi
