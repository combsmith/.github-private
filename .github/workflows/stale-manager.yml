name: Stale Manager
# readme-agent: Stale manager agent — warns and closes stale issues/PRs across the org.

on:
  schedule:
    - cron: '29 9 * * 1'   # Every Monday at 09:29 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, log intended actions only — no writes"
        required: false
        default: "true"
        type: string
      target_org:
        description: "GitHub org to scan (default: petry-projects)"
        required: false
        type: string

# Staged: read-only permissions until DRY_RUN=false is set and permissions are updated.
# Live mode requires: issues: write, pull-requests: write
permissions:
  issues: read
  pull-requests: read

concurrency:
  group: stale-manager
  cancel-in-progress: false

jobs:
  stale:
    # AGENTS_PAUSED (#1525, #2249): with the fleet paused this job is skipped
    # (neutral, not red) and `fleet-paused` below reports why.
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Operator model override for the family resolver (ai_model_for_family, #1979).
      AI_MODELS_CLAUDE: ${{ vars.AI_MODELS_CLAUDE || '' }}
      GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TARGET_ORG: ${{ inputs.target_org || vars.TARGET_ORG || 'petry-projects' }}
      STALE_DAYS_ISSUE: ${{ vars.STALE_DAYS_ISSUE || '60' }}
      STALE_DAYS_PR: ${{ vars.STALE_DAYS_PR || '30' }}
      GRACE_DAYS: ${{ vars.GRACE_DAYS || '7' }}
      # Staged by default: set LIVE_MODE=true repo variable to enable writes.
      # LIVE_MODE is the authoritative gate — dispatch input cannot bypass it.
      DRY_RUN: ${{ vars.LIVE_MODE == 'true' && 'false' || 'true' }}
      REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || 'claude' }}
      ACTION_TIMEOUT_SEC: ${{ vars.ACTION_TIMEOUT_SEC || '120' }}
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || '2.1.138' }}

    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache claude-code CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-${{ runner.os }}

      - name: Install claude-code CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi

      - name: Run stale manager
        run: bash scripts/stale-manager.sh

  # Fleet pause notice (#2249). With AGENTS_PAUSED=true the `stale` job above is
  # skipped by its `if:`, and a skipped job cannot log. This job runs instead, on
  # the same events, and says why in one line. Inventory and rules: AGENTS.md
  # "Pausing the agent fleet" and scripts/lib/fleet-pause-registry.tsv.
  fleet-paused:
    if: vars.AGENTS_PAUSED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      PAUSE_SOURCE: ${{ vars.AGENTS_PAUSE_SOURCE }}
      PAUSE_UNTIL: ${{ vars.AGENTS_PAUSE_UNTIL }}
    steps:
      - name: Report the fleet pause
        run: |
          echo "::notice title=Agent fleet paused::Stale Manager: not run, the agent fleet is paused (AGENTS_PAUSED=true)." \
            "Pause source: ${PAUSE_SOURCE:-not set (paused by hand)}." \
            "Paused until: ${PAUSE_UNTIL:-not set}."
