name: Dependency Advisory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'go.mod'
      - 'go.sum'
      - 'requirements.txt'
      - 'Pipfile'
      - 'Pipfile.lock'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'pom.xml'
      - 'build.gradle'
      - 'build.gradle.kts'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advisory:
    # AGENTS_PAUSED (#1525, #2249): with the fleet paused this job is skipped
    # (neutral, not red) and `fleet-paused` below reports why.
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Operator model override for the family resolver (ai_model_for_family, #1979).
      AI_MODELS_CLAUDE: ${{ vars.AI_MODELS_CLAUDE || '' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      SKIP_BOT_PRS: ${{ vars.DEP_ADVISORY_SKIP_BOT_PRS || 'true' }}
      # Pin via vars.CLAUDE_CODE_VERSION for reproducible caching; mirrors pr-review.yml.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'

      - name: Resolve claude-code version
        # A literal "latest" cache key never changes, so the first CLI ever cached
        # was reused indefinitely (2.1.138 outlived the Opus 5.5 launch — #1957).
        # Resolve it to the concrete npm version so a new release misses the cache,
        # and install exactly that version on a miss (never re-resolve "latest");
        # a pinned vars.CLAUDE_CODE_VERSION passes through unchanged.
        id: claude_code_version
        env:
          REQUESTED_VERSION: ${{ env.CLAUDE_CODE_VERSION || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          v="$REQUESTED_VERSION"
          install="$v"
          if [ "$v" = "latest" ]; then
            v="$(npm view @anthropic-ai/claude-code version 2>/dev/null || true)"
            if [ -n "$v" ]; then
              install="$v"
            else
              v="latest-$(date -u +%G-w%V)"
              echo "::warning::could not resolve the latest claude-code version; using weekly cache key $v"
            fi
          fi
          echo "claude-code cache version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "install=$install" >> "$GITHUB_OUTPUT"

      - name: Cache claude-code CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ steps.claude_code_version.outputs.version }}-${{ runner.os }}

      - name: Install Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: ${{ steps.claude_code_version.outputs.install || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if command -v claude >/dev/null 2>&1; then
            echo "claude-code cache hit: $(claude --version)"
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # NOSONAR
          fi

      - name: Run dependency advisory
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || secrets.GITHUB_TOKEN }}
        run: bash scripts/aw-dependency-advisory.sh

  # Fleet pause notice (#2249). With AGENTS_PAUSED=true the `advisory` job above is
  # skipped by its `if:`, and a skipped job cannot log. This job runs instead, on
  # the same events, and says why in one line. Inventory and rules: AGENTS.md
  # "Pausing the agent fleet" and scripts/lib/fleet-pause-registry.tsv.
  fleet-paused:
    if: vars.AGENTS_PAUSED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      PAUSE_SOURCE: ${{ vars.AGENTS_PAUSE_SOURCE }}
      PAUSE_UNTIL: ${{ vars.AGENTS_PAUSE_UNTIL }}
    steps:
      - name: Report the fleet pause
        run: |
          echo "::notice title=Agent fleet paused::Dependency Advisory: not run, the agent fleet is paused (AGENTS_PAUSED=true)." \
            "Pause source: ${PAUSE_SOURCE:-not set (paused by hand)}." \
            "Paused until: ${PAUSE_UNTIL:-not set}."
