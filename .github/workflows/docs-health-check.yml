name: Docs Health Check
# readme-report: Docs health check — flags stale/broken docs as an issue.

on:
  schedule:
    # Weekly — Sunday at 00:21 UTC
    - cron: '21 0 * * 0'
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Days without update before a doc is considered stale"
        required: false
        default: "90"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-health-check
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Operator model override for the family resolver (ai_model_for_family, #1979).
      AI_MODELS_CLAUDE: ${{ vars.AI_MODELS_CLAUDE || '' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ORG: ${{ vars.ORG || 'petry-projects' }}
      STALE_DAYS: ${{ inputs.stale_days || vars.DOCS_STALE_DAYS || '90' }}
      DOCS_STALENESS_IGNORE: ${{ vars.DOCS_STALENESS_IGNORE || '' }}
      REPORT_REPO: ${{ vars.ORG || 'petry-projects' }}/.github-private
      # Pin via vars.CLAUDE_CODE_VERSION for reproducible caching; mirrors pr-review.yml.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}

    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Resolve claude-code version
        # A literal "latest" cache key never changes, so the first CLI ever cached
        # was reused indefinitely (2.1.138 outlived the Opus 5.5 launch — #1957).
        # Resolve it to the concrete npm version so a new release misses the cache,
        # and install exactly that version on a miss (never re-resolve "latest");
        # a pinned vars.CLAUDE_CODE_VERSION passes through unchanged.
        id: claude_code_version
        env:
          REQUESTED_VERSION: ${{ env.CLAUDE_CODE_VERSION || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          v="$REQUESTED_VERSION"
          install="$v"
          if [ "$v" = "latest" ]; then
            v="$(npm view @anthropic-ai/claude-code version 2>/dev/null || true)"
            if [ -n "$v" ]; then
              install="$v"
            else
              v="latest-$(date -u +%G-w%V)"
              echo "::warning::could not resolve the latest claude-code version; using weekly cache key $v"
            fi
          fi
          echo "claude-code cache version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "install=$install" >> "$GITHUB_OUTPUT"

      - name: Cache claude-code CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ steps.claude_code_version.outputs.version }}-${{ runner.os }}

      - name: Install Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: ${{ steps.claude_code_version.outputs.install || vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if command -v claude >/dev/null 2>&1; then
            echo "claude-code cache hit: $(claude --version)"
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # NOSONAR
          fi

      - name: Run docs health check
        env:
          GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
        run: bash scripts/aw-docs-health-check.sh

      - name: Truncate report if needed
        run: |
          if [ -f docs_health_report.md ]; then
            if [ "$(wc -c < docs_health_report.md)" -gt 60000 ]; then
              head -c 60000 docs_health_report.md > docs_health_report.md.tmp
              mv docs_health_report.md.tmp docs_health_report.md
              printf '\n\n---\n_Report truncated at 60 000 bytes._\n' >> docs_health_report.md
            fi
          fi

      - name: Create issue with findings
        if: env.HAS_STALE_DOCS == 'true' && hashFiles('docs_health_report.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('docs_health_report.md', 'utf8');
            if (!report.trim()) {
              core.setFailed('Report file is empty');
              return;
            }
            const today = new Date().toISOString().split('T')[0];
            const titlePrefix = 'Docs Health Check — stale files detected';
            // Date-stamped title → a fresh issue every run. Close prior open ones.
            const priors = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-check,automated-report', per_page: 100,
            });
            for (const p of priors) {
              if (!p.pull_request && p.title.startsWith(titlePrefix)) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: p.number, state: 'closed', state_reason: 'completed',
                  });
                } catch (err) { core.warning(`could not close prior digest #${p.number}: ${err.message}`); }
              }
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titlePrefix} ${today}`,
              body: report,
              labels: ['health-check', 'automated-report'],
            });
            core.notice(`Issue created: ${issue.data.html_url}`);

      - name: Annotate clean run
        if: env.HAS_STALE_DOCS != 'true'
        run: |
          echo "::notice::Docs health check passed — no stale files found (threshold: ${STALE_DAYS} days)."
