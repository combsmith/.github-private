name: Release Notes Generator
# readme-agent: Release-notes agent — drafts Keep-a-Changelog entries from merged PRs and opens a CHANGELOG PR.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      before_sha:
        description: "Base commit SHA to compare against (default: HEAD^)"
        required: false
        type: string
      dry_run:
        description: "If true, generate content but do not open a PR"
        required: false
        default: "true"
        type: string

# Staged: read-only permissions until DRY_RUN=false is set and permissions are updated.
# Live mode requires: contents: write, pull-requests: write
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-notes-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-notes:
    # AGENTS_PAUSED (#1525, #2249): with the fleet paused this job is skipped
    # (neutral, not red) and `fleet-paused` below reports why.
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Operator model override for the family resolver (ai_model_for_family, #1979).
      AI_MODELS_CLAUDE: ${{ vars.AI_MODELS_CLAUDE || '' }}
      GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      BEFORE_SHA: ${{ inputs.before_sha || github.event.before || '' }}
      CHANGELOG_FILE: ${{ vars.CHANGELOG_FILE || 'CHANGELOG.md' }}
      CHANGELOG_LABELS: ${{ vars.CHANGELOG_LABELS || 'feat,fix' }}
      # Staged by default: set LIVE_MODE=true repo variable to enable PR creation.
      # LIVE_MODE is the authoritative gate — dispatch input cannot bypass it.
      DRY_RUN: ${{ vars.LIVE_MODE == 'true' && 'false' || 'true' }}
      REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || 'claude' }}
      ACTION_TIMEOUT_SEC: ${{ vars.ACTION_TIMEOUT_SEC || '120' }}
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || '2.1.138' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.DON_PETRY_BOT_GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Cache claude-code CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-${{ runner.os }}

      - name: Install claude-code CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi

      - name: Configure git identity
        if: env.DRY_RUN != 'true'
        run: |
          git config --global user.email "donpetry-bot@users.noreply.github.com"
          git config --global user.name "donpetry-bot"

      - name: Generate release notes
        run: bash scripts/release-notes.sh

  # Fleet pause notice (#2249). With AGENTS_PAUSED=true the `release-notes` job above is
  # skipped by its `if:`, and a skipped job cannot log. This job runs instead, on
  # the same events, and says why in one line. Inventory and rules: AGENTS.md
  # "Pausing the agent fleet" and scripts/lib/fleet-pause-registry.tsv.
  fleet-paused:
    if: vars.AGENTS_PAUSED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      PAUSE_SOURCE: ${{ vars.AGENTS_PAUSE_SOURCE }}
      PAUSE_UNTIL: ${{ vars.AGENTS_PAUSE_UNTIL }}
    steps:
      - name: Report the fleet pause
        run: |
          echo "::notice title=Agent fleet paused::Release Notes Generator: not run, the agent fleet is paused (AGENTS_PAUSED=true)." \
            "Pause source: ${PAUSE_SOURCE:-not set (paused by hand)}." \
            "Paused until: ${PAUSE_UNTIL:-not set}."
